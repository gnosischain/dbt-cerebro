      validation:
      - 'duplicate excess: count() - uniqExact((block_timestamp, transaction_hash, log_index)) == 0'
      - 'no undecoded rows: countIf(event_name = '''') == 0'
      - 'both deployments decoded: uniqExact(contract_address) == 2'
      reprocess_runbook: >-
        Rebuild with scripts/full_refresh/refresh.py (a plain `dbt run --full-
        refresh` also works but re-scans the whole logs history in one query). A
        single-pass rebuild of the largest model here took ~36 min and succeeded
        on an idle cluster; it OOMed with ClickHouse Code 241 only while heavy
        ad-hoc queries ran concurrently, so retry when the cluster is quiet
        before assuming the model is too fat. If it still OOMs, declare
        meta.full_refresh batch_months and let refresh.py batch it - decode_logs
        honors the start_month/end_month vars. Because the strategy is append,
        drop target partitions first (macros/db/drop_partition.sql) if they
        already hold rows. Changing contracts_hopr_registry_static or the oracle
        ABI names requires `dbt seed` FIRST - refresh.py rebuilds models only,
        and a stale registry yields silently undecoded rows.
  columns:
  - name: block_number
    description: >
      Block height of the log.
    data_type: UInt64
  - name: block_timestamp
    description: >
      On-chain timestamp of the log; the incremental watermark column.
    data_type: DateTime
    tests: [not_null]
  - name: transaction_hash
    description: >
      Hash of the transaction that emitted the log.
    data_type: String
  - name: transaction_index
    description: >
      Index of the transaction within its block.
    data_type: UInt32
  - name: log_index
    description: >
      Index of the log within its block.
    data_type: UInt32
  - name: contract_address
    description: >
      Emitting HOPR contract, bare hex without 0x prefix. Join to
      contracts_hopr_registry to resolve network and contract_type.
    data_type: String
    tests: [not_null]
  - name: event_name
    description: >
      Decoded event name. An empty string means the ABI join missed - see
      contracts_hopr_registry on abi_source_address.
    data_type: String
  - name: decoded_params
    description: >
      Map of decoded event params. AddressAnnouncement exposes `node` and
      `baseMultiaddr` (for example /ip4/34.159.20.69/tcp/9024).
    data_type: Map(String, Nullable(String))

