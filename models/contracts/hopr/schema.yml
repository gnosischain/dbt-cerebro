- name: contracts_hopr_NodeSafeMigration_events
  description: >
    dufour to jura v4 migration tracking. Expected to be EMPTY until migration
    starts. The documented procedure requires
    redeeming all tickets and closing all channels first, so a dufour mass channel-
    close wave is a migration signal, not node abandonment.
  meta:
    owner: analytics_team
    authoritative: false
