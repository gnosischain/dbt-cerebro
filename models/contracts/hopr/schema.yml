          implementation address instead of the proxy. The `no undecoded rows`
          query in validation below is the check.
      - id: empty-until-migration-starts
        text: >-
          Zero rows is the CORRECT state until node operators begin migrating
          from dufour to jura; it is not a decode failure. The contract exists
          only on jura, so this model covers ONE network unlike its siblings.
          When rows appear, SafeAndModuleMigrationCompleted counts migration
          progress.
      - id: watermark-skips-late-logs
        text: >-
          The decode is append-only off a block_number/block_timestamp
          watermark, so logs landing in execution.logs below the current high-
          water mark are never decoded. A backfill or gap-repair of the raw
          logs requires re-decoding the affected range explicitly.
      hazards: [decode-watermark-late-logs, raw-logs-ingestion-holes, append-over-populated-duplicates, ch-overcommit-victim]
      validation:
      - 'duplicate excess: count() - uniqExact((block_timestamp, transaction_hash, log_index)) == 0'
      - 'no undecoded rows: countIf(event_name = '''') == 0'
      reprocess_runbook: >-
        Rebuild with scripts/full_refresh/refresh.py (a plain `dbt run --full-
        refresh` also works but re-scans the whole logs history in one query). A
        single-pass rebuild of the largest model here took ~36 min and succeeded
        on an idle cluster; it OOMed with ClickHouse Code 241 only while heavy
        ad-hoc queries ran concurrently, so retry when the cluster is quiet
        before assuming the model is too fat. If it still OOMs, declare
        meta.full_refresh batch_months and let refresh.py batch it - decode_logs
        honors the start_month/end_month vars. Because the strategy is append,
        drop target partitions first (macros/db/drop_partition.sql) if they
        already hold rows. Changing contracts_hopr_registry_static or the oracle
        ABI names requires `dbt seed` FIRST - refresh.py rebuilds models only,
        and a stale registry yields silently undecoded rows.
  columns:
  - name: block_number
    description: >
      Block height of the log.
    data_type: UInt64
  - name: block_timestamp
    description: >
      On-chain timestamp of the log; the incremental watermark column.
    data_type: DateTime
    tests: [not_null]
  - name: transaction_hash
    description: >
      Hash of the transaction that emitted the log.
    data_type: String
  - name: transaction_index
    description: >
      Index of the transaction within its block.
    data_type: UInt32
  - name: log_index
    description: >
      Index of the log within its block.
    data_type: UInt32
  - name: contract_address
    description: >
      Emitting HOPR contract, bare hex without 0x prefix. Join to
      contracts_hopr_registry to resolve network and contract_type.
    data_type: String
    tests: [not_null]
  - name: event_name
    description: >
      Decoded event name. An empty string means the ABI join missed - see
      contracts_hopr_registry on abi_source_address.
    data_type: String
  - name: decoded_params
    description: >
      Map of decoded event params (safeProxy, oldModuleProxy, newModuleProxy).
    data_type: Map(String, Nullable(String))

- name: contracts_hopr_TicketPriceOracle_events
  description: >
    TicketPriceUpdated, required to value redeemed tickets: ticket price is an
    oracle parameter and is not carried in the ticket event itself. Winning-ticket
    payout equals ticket price divided by winning probability - verified against
    observed payouts (dufour 10.0, jura 2.5 wxHOPR).
  tests:
  # Backstop for the unnamed-ABI regression. Model-level, NOT column-level: a
  # column-level expression_is_true renders as `<column> <expression>`, which is
  # only valid for suffix expressions like `> 0`.
  - dbt_utils.expression_is_true:
      expression: "has(mapKeys(decoded_params), 'newTicketPrice')"
      config:
        where: "event_name = 'TicketPriceUpdated'"
  meta:
    owner: analytics_team
    authoritative: false
    agent:
      grain: [block_timestamp, transaction_hash, log_index]
      semantics: event_stream
      invariants:
      - id: one-row-per-log
        text: >-
          One row per emitted log. (block_timestamp, transaction_hash,
          log_index) is both the unique_key and the ReplacingMergeTree
          order_by, so count() - uniqExact((block_timestamp, transaction_hash,
          log_index)) must be 0.
      - id: no-undecoded-rows
        text: >-
          event_name must never be empty. An empty event_name means the ABI
          join missed, which happens silently with no error - the usual cause
          is contracts_hopr_registry.abi_source_address pointing at an
          implementation address instead of the proxy. The `no undecoded rows`
          query in validation below is the check.
      - id: all-environments-present
        text: >-
          THREE HOPR environments live on Gnosis Chain simultaneously (dufour,
          jura and the rotsee testnet) and dufour emits the same logical events
          under DIFFERENT topic0s than the v4 pair. The ABI resolves per contract
          address, so a single-ABI decode would silently drop an environment
          entirely. Each v4 environment was also REDEPLOYED once, so a network
          has more than one contract_address. Assert uniqExact(network) == 3 and
          check presence per network -- never a bare address count.
      - id: price-params-must-be-named
        text: >-
          The on-chain ABI leaves both TicketPriceUpdated params unnamed, so
          decode_logs collapses every map key to '' and
          decoded_params['newTicketPrice'] returns NULL with no error.
          scripts/signatures/name_hopr_oracle_params.py restores the names,
          but only after regenerating event_signatures, reseeding AND full-
          refreshing this model - skipping any step fails silently. Enforced by
          the model-level dbt_utils.expression_is_true test above.
      - id: price-series-is-a-chain
        text: >-
          Each event's oldTicketPrice equals the previous event's
          newTicketPrice, which is what proves the unnamed params are ordered
          (old, new). CHAIN PER contract_address, NOT per network: each v4
          environment was redeployed, and a fresh oracle starts its own series
          from zero, so splicing the two generations of one network into a single
          ordered series breaks the equality at the redeploy boundary and reads
          as corrupt data when nothing is wrong.
      - id: watermark-skips-late-logs
        text: >-
          The decode is append-only off a block_number/block_timestamp
          watermark, so logs landing in execution.logs below the current high-
          water mark are never decoded. A backfill or gap-repair of the raw
          logs requires re-decoding the affected range explicitly.
      hazards: [decode-watermark-late-logs, raw-logs-ingestion-holes, append-over-populated-duplicates, ch-overcommit-victim]
      validation:
      - 'duplicate excess: count() - uniqExact((block_timestamp, transaction_hash, log_index)) == 0'
      - 'params are named: countIf(event_name = ''TicketPriceUpdated'' AND NOT has(mapKeys(decoded_params), ''newTicketPrice'')) == 0'
      reprocess_runbook: >-
        Rebuild with scripts/full_refresh/refresh.py (a plain `dbt run --full-
        refresh` also works but re-scans the whole logs history in one query). A
        single-pass rebuild of the largest model here took ~36 min and succeeded
        on an idle cluster; it OOMed with ClickHouse Code 241 only while heavy
        ad-hoc queries ran concurrently, so retry when the cluster is quiet
        before assuming the model is too fat. If it still OOMs, declare
        meta.full_refresh batch_months and let refresh.py batch it - decode_logs
        honors the start_month/end_month vars. Because the strategy is append,
        drop target partitions first (macros/db/drop_partition.sql) if they
        already hold rows. Changing contracts_hopr_registry_static or the oracle
        ABI names requires `dbt seed` FIRST - refresh.py rebuilds models only,
        and a stale registry yields silently undecoded rows.
  columns:
  - name: block_number
    description: >
      Block height of the log.
    data_type: UInt64
  - name: block_timestamp
    description: >
      On-chain timestamp of the log; the incremental watermark column.
    data_type: DateTime
    tests: [not_null]
  - name: transaction_hash
    description: >
      Hash of the transaction that emitted the log.
    data_type: String
  - name: transaction_index
    description: >
      Index of the transaction within its block.
    data_type: UInt32
  - name: log_index
    description: >
      Index of the log within its block.
    data_type: UInt32
  - name: contract_address
    description: >
      Emitting HOPR contract, bare hex without 0x prefix. Join to
      contracts_hopr_registry to resolve network and contract_type.
    data_type: String
    tests: [not_null]
  - name: event_name
    description: >
      Decoded event name. An empty string means the ABI join missed - see
      contracts_hopr_registry on abi_source_address.
    data_type: String
  - name: decoded_params
    description: >
      Map of decoded event params. oldTicketPrice and newTicketPrice are in wei;
      the names are supplied by scripts/signatures/name_hopr_oracle_params.py
      because the on-chain ABI leaves them unnamed.
    data_type: Map(String, Nullable(String))

- name: contracts_hopr_WinningProbabilityOracle_events
  description: >
    WinProbUpdated - the other half of ticket valuation. dufour's verified ABI omits
    the param names while jura's keeps them; both are restored from the Solidity
    source.
