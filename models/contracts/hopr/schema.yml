          jura) and they emit the same logical events under DIFFERENT topic0s.
          The ABI resolves per contract address, so a single-ABI decode would
          silently drop one network entirely. Any model covering both must
          keep uniqExact(contract_address) == 2.
      - id: proxy-abi-resolves-to-proxy-address
        text: >-
          jura's Announcements is an EIP-1967 proxy (implementation
          0x914c4ad36e5ec147be0a94c671d7440f1d0fc8c1) but its event_signatures
          rows are keyed on the PROXY address, because fetch_abi_to_csv.py
          stores the implementation's ABI under the proxy's contract_address.
          Setting abi_source_address to the implementation makes the ABI join
          miss and produced 59 rows with empty event_name and no error.
      - id: watermark-skips-late-logs
        text: >-
          The decode is append-only off a block_number/block_timestamp
