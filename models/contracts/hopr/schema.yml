version: 2

models:
- name: contracts_hopr_registry
  description: >
    Address / ABI / network resolution point for every HOPR model. Two HOPR
    networks run on Gnosis Chain simultaneously - dufour (legacy production,
    hoprd v2/v3) and jura (v4, the network the GnosisVPN client defaults to,
    live since block 47415377 / 2026-07-27). The same logical event has a
    different topic0 on each, so ABIs must resolve per contract address.
    Addresses come from hoprnet/contracts ethereum/bindings/contracts-addresses.json;
    every start_blocktime is the contract's own creation date from
    execution.contracts. The pre-jura staging HoprChannels
    0x81a79fcde8ffe6452e51d8e0493b37c2a5a09c57 is deliberately excluded.
  meta:
    owner: analytics_team
    authoritative: false
    agent:
      grain: [address]
      semantics: dimension
      ground_truth: >-
        hoprnet/contracts ethereum/bindings/contracts-addresses.json plus
        execution.contracts creation dates, loaded via the
        contracts_hopr_registry_static seed.
      invariants:
      - id: one-row-per-address
        text: >-
          address is unique. A duplicate would make every decode_logs join
          ambiguous and silently double-decode that deployment.
      - id: abi-source-is-proxy-not-impl
        text: >-
          For EIP-1967 proxies, abi_source_address must be the PROXY address
          (where event_signatures rows are keyed), never the implementation.
          Pointing at the impl makes the ABI join miss and yields empty
          event_name with no error.
      - id: both-networks-present
        text: >-
          Registry must contain both dufour and jura for every shared
          contract_type both networks deploy. A missing network silently drops
          that network's events from every downstream decode.
      - id: staging-channels-excluded
        text: >-
          Pre-jura staging HoprChannels
          0x81a79fcde8ffe6452e51d8e0493b37c2a5a09c57 must never appear. It is
          not production and must never be aggregated with either network.
      hazards: [decode-watermark-late-logs, decoder-watermark-literals]
      validation:
      - 'uniqExact(address) == count()'
      - 'uniqExact(network) == 2'
      - 'countIf(address = ''0x81a79fcde8ffe6452e51d8e0493b37c2a5a09c57'') == 0'
      reprocess_runbook: >-
        `dbt seed --select contracts_hopr_registry_static` then `dbt run
        --select contracts_hopr_registry+`. Changing the seed without reseeding
        leaves every decode on a stale address set; a wrong abi_source_address
        yields silently undecoded rows rather than an error.
  columns:
  - name: address
    description: Contract address, lowercased with 0x prefix.
    data_type: String
    tests: [not_null, unique]
  - name: network
    description: HOPR network this deployment belongs to (dufour or jura).
    data_type: LowCardinality(String)
    tests:
    - not_null
    - accepted_values:
        values: ['dufour', 'jura']
  - name: contract_type
    description: Logical contract type, used as the decode_logs contract_type_filter.
    data_type: String
    tests:
    - not_null
    - accepted_values:
        values: ['Channels', 'Announcements', 'NodeStakeFactory', 'NodeSafeRegistry',
                 'NodeSafeMigration', 'TicketPriceOracle', 'WinningProbabilityOracle',
                 'NetworkRegistry']
  - name: abi_source_address
    description: >
      Address whose event_signatures rows carry this contract's ABI. For proxies
      this is the PROXY's own address, not the implementation:
      fetch_abi_to_csv.py stores the implementation's ABI under the proxy's
      contract_address, so signature_generator keys the rows on the proxy. Only
      point this at a different address when the ABI genuinely lives under
      another contract (shared runtime ABIs, Safe singletons).
    data_type: String
    tests: [not_null]
  - name: is_dynamic
    description: >
      1 if the contract was discovered from a factory, 0 if statically declared.
      All HOPR rows are static.
    data_type: UInt8
  - name: start_blocktime
    description: >
      Contract creation date, taken from execution.contracts rather than estimated
      from a block delta.
    data_type: String
  - name: discovery_source
    description: Provenance of the row, for example hoprnet_contracts_addresses_json.
    data_type: String

- name: contracts_hopr_Channels_events
  description: >
    Decoded HoprChannels events for both live networks (dufour and jura). The ABI is
    resolved per contract address, which is what makes the dual-deployment decode
    correct: the two networks emit the same logical events under different topic0s,
    so a single-ABI decode would silently drop one of them. All 14 topic0s were
    verified against keccak of their canonical signatures. Neither network emits an
    amount - every balance-bearing event reports the NEW balance, so value requires
    a per-channel diff (see int_hopr_channels_events). HEAVY: ~3.0M rows decoded
    from the full execution.logs history since 2023-08-29.
  meta:
    owner: analytics_team
    authoritative: false
    agent:
      grain: [block_timestamp, transaction_hash, log_index]
      semantics: event_stream
      invariants:
      - id: one-row-per-log
        text: >-
          One row per emitted log. (block_timestamp, transaction_hash,
          log_index) is both the unique_key and the ReplacingMergeTree
          order_by, so count() - uniqExact((block_timestamp, transaction_hash,
          log_index)) must be 0.
      - id: no-undecoded-rows
        text: >-
          event_name must never be empty. An empty event_name means the ABI
          join missed, which happens silently with no error - the usual cause
          is contracts_hopr_registry.abi_source_address pointing at an
          implementation address instead of the proxy. The `no undecoded rows`
          query in validation below is the check.
      - id: both-networks-present
        text: >-
          Two HOPR networks live on Gnosis Chain simultaneously (dufour and
          jura) and they emit the same logical events under DIFFERENT topic0s.
          The ABI resolves per contract address, so a single-ABI decode would
          silently drop one network entirely. Any model covering both must
          keep uniqExact(contract_address) == 2.
      - id: ticket-redemption-pairs-with-balance-decrease
        text: >-
          A ticket redemption always moves value out of the channel, so within
          a (network, day) countIf(event_name='TicketRedeemed') must equal
          countIf(event_name='ChannelBalanceDecreased'). This holds exactly on
          both networks and is the cheapest guard against the dual-deployment
          decode half-failing. It is
          an AGGREGATE equality, so it cannot be a row-level generic test - run
          the `ticket pairing` query in validation below.
      - id: watermark-skips-late-logs
        text: >-
          The decode is append-only off a block_number/block_timestamp
          watermark, so logs landing in execution.logs below the current high-
          water mark are never decoded. A backfill or gap-repair of the raw
          logs requires re-decoding the affected range explicitly.
      hazards: [decode-watermark-late-logs, raw-logs-ingestion-holes, append-over-populated-duplicates, ch-overcommit-victim]
      validation:
      - 'duplicate excess: count() - uniqExact((block_timestamp, transaction_hash, log_index)) == 0'
      - 'no undecoded rows: countIf(event_name = '''') == 0'
      - 'both deployments decoded: uniqExact(contract_address) == 2'
      - 'ticket pairing: countIf(event_name = ''TicketRedeemed'') == countIf(event_name = ''ChannelBalanceDecreased'')'
      reprocess_runbook: >-
        Rebuild with scripts/full_refresh/refresh.py (a plain `dbt run --full-
        refresh` also works but re-scans the whole logs history in one query). A
        single-pass rebuild of the largest model here took ~36 min and succeeded
        on an idle cluster; it OOMed with ClickHouse Code 241 only while heavy
        ad-hoc queries ran concurrently, so retry when the cluster is quiet
        before assuming the model is too fat. If it still OOMs, declare
        meta.full_refresh batch_months and let refresh.py batch it - decode_logs
        honors the start_month/end_month vars. Because the strategy is append,
        drop target partitions first (macros/db/drop_partition.sql) if they
        already hold rows. Changing contracts_hopr_registry_static or the oracle
        ABI names requires `dbt seed` FIRST - refresh.py rebuilds models only,
        and a stale registry yields silently undecoded rows.
  columns:
  - name: block_number
    description: >
      Block height of the log.
    data_type: UInt64
  - name: block_timestamp
    description: >
      On-chain timestamp of the log; the incremental watermark column.
    data_type: DateTime
    tests: [not_null]
  - name: transaction_hash
    description: >
      Hash of the transaction that emitted the log.
    data_type: String
  - name: transaction_index
    description: >
      Index of the transaction within its block.
    data_type: UInt32
  - name: log_index
    description: >
      Index of the log within its block.
    data_type: UInt32
  - name: contract_address
    description: >
      Emitting HOPR contract, bare hex without 0x prefix. Join to
      contracts_hopr_registry to resolve network and contract_type.
    data_type: String
    tests: [not_null]
  - name: event_name
    description: >
      Decoded event name. An empty string means the ABI join missed - see
      contracts_hopr_registry on abi_source_address.
    data_type: String
  - name: decoded_params
    description: >
      Map of decoded event params. dufour carries typed scalars (newBalance
      uint96, newTicketIndex uint48, closureTime uint32); jura carries the whole
      packed storage word as `channel` bytes32.
    data_type: Map(String, Nullable(String))

- name: contracts_hopr_Announcements_events
  description: >
    Node identity events. AddressAnnouncement carries the announced multiaddress (a
    raw IP), which is the input for geo/ASN enrichment against crawlers_data.ipinfo;
    KeyBinding links a node's packet key to its chain key. jura's contract is an
    EIP-1967 proxy and additionally emits KeyBindingFeeUpdate.
  meta:
    owner: analytics_team
    authoritative: false
    agent:
      grain: [block_timestamp, transaction_hash, log_index]
      semantics: event_stream
      invariants:
      - id: one-row-per-log
