version: 2

sources:
  - name: rpc_state_indexer
    schema: "{{ env_var('DBT_RPC_STATE_INDEXER_SCHEMA', 'rpc_state_indexer') }}"
    meta:
      owner: analytics_team
      authoritative: false
    description: >
      Base tables of the rpc-state-indexer service. The selection of which attempt
      counts as the published observation for a (target, day) is made in dbt
      (stg_rpc_state_indexer__publications), not by the indexer's v_*_published
      views: those gate on the target's current config hash, so any change to the
      indexer's config model silently hides all earlier history (2026-09-09).
    tables:
      - name: census_publications
        description: >
          One row per publication of a verified census attempt (chain, job, target,
          day). A target-day can carry several publications (re-censused under a new
          config hash); stg_rpc_state_indexer__publications keeps the newest verified one.
        loaded_at_field: published_at
        freshness:
          warn_after: {count: 36, period: hour}
          error_after: {count: 48, period: hour}
      - name: census_attempts
        description: Every census attempt with its verification outcome (ReplacingMergeTree; read FINAL).
      - name: census_errors
        description: Terminal errors per attempt; an attempt with an error row is never published.
      - name: day_anchors
        description: Per-chain day anchor resolutions; canonical when exactly one finalized resolution exists.
      - name: token_scalars
        description: Raw per-attempt token scalars (totalSupply etc.); join to the published attempt.
      - name: token_balances
        description: Raw per-attempt (token, holder) balances, ~2.5e9 rows; join to the published attempt and always filter chain_id + job_name.
