version: 2

sources:
  - name: crawlers_data
    description: "External datasets ingested by various crawlers (not consensus/execution authoritative state)."
    schema: crawlers_data
    tags: ["external", "crawlers", "enrichment"]
    freshness:
      warn_after: {count: 36, period: hour}
      error_after: {count: 72, period: hour}
    meta:
      owner: analytics_team
      authoritative: false

    tables:
      - name: country_codes
        freshness: null
        description: "ISO3166 country codes mapping."
        columns:
          - name: name
            data_type: String
          - name: alpha-2
            data_type: String
          - name: alpha-3
            data_type: String
          - name: country-code
            data_type: String
          - name: iso_3166-2
            data_type: String
          - name: region
            data_type: String
          - name: sub-region
            data_type: String
          - name: intermediate-region
            data_type: String
          - name: region-code
            data_type: String
          - name: sub-region-code
            data_type: String
          - name: intermediate-region-code
            data_type: String

      - name: ember_generation_monthly
        description: >
          Ember monthly electricity data ("generation" release, wide format): one row
          per Area x month x Electricity source, metrics as columns. The click-runner
          ember-ingestor reloads the whole file on the 8th and 21st into a
          ReplacingMergeTree(ingested_at); read it with FINAL. Replaced
          ember_electricity_data, whose long-format file Ember retired on 2026-11-02
          (that table stays frozen at data to 2026-06).
        # Freshness on the DATA date of the World series, which gates every ESG mart
        # (a month is emitted only once Ember publishes World for it). Ember publishes
        # World about two months after month end and we ingest on the 8th and 21st, so
        # a healthy max(Date) is 65-110 days old (a late release plus our 13-day gap).
        # An ingest-time check cannot see a frozen upstream: the old file froze at
        # 2026-06 while every load stayed green (lesson frozen-upstream-behind-fresh-ingest).
        loaded_at_field: "toDateTime(`Date`)"
        freshness:
          warn_after: {count: 120, period: day}
          error_after: {count: 150, period: day}
          filter: "`Area` = 'World' AND `Electricity source` = 'Total generation'"
        columns:
          - name: Area
            data_type: String
          - name: ISO 3 code
            data_type: String
            description: "ISO 3166-1 alpha-3; empty for Ember's aggregate regions (World, EU, G20, ...)."
          - name: Date
            data_type: Date
            description: "First day of the month."
          - name: Area type
            data_type: LowCardinality(String)
          - name: Electricity source
            data_type: LowCardinality(String)
          - name: Is aggregated source
            data_type: Bool
          - name: Generation (TWh)
            data_type: Nullable(Float64)
          - name: Generation YoY change (TWh)
            data_type: Nullable(Float64)
          - name: Generation YoY change (%)
            data_type: Nullable(Float64)
          - name: Share of generation (%)
            data_type: Nullable(Float64)
          - name: Share of generation YoY change (% points)
            data_type: Nullable(Float64)
          - name: Emissions (MtCO2e)
            data_type: Nullable(Float64)
          - name: Emissions YoY change (MtCO2e)
            data_type: Nullable(Float64)
          - name: Emissions YoY change (%)
            data_type: Nullable(Float64)
          - name: Share of emissions (%)
            data_type: Nullable(Float64)
          - name: Emissions intensity (gCO2e/kWh)
            data_type: Nullable(Float64)
          - name: Continent
            data_type: LowCardinality(String)
          - name: Ember region
            data_type: LowCardinality(String)
          - name: EU member
            data_type: Bool
          - name: OECD member
            data_type: Bool
          - name: G20 member
            data_type: Bool
          - name: G7 member
            data_type: Bool
          - name: ASEAN member
            data_type: Bool
          - name: ingested_at
            data_type: DateTime
            description: "Load time; one value per load (now() is evaluated once per INSERT)."

      - name: gpay_wallets
        freshness: null
        description: "Subset of SAFE wallet addresses discovered via gpay integration crawler."
        columns:
          - name: SAFE_address
            data_type: String
          - name: SAFE_createdAt
            data_type: DateTime

      - name: gpay_operational_wallets
        freshness: null
        description: >
          Gnosis Pay company-operated wallet addresses (treasury, relayers,
          settlement). Used purely as an EXCLUSION list so company wallets are
          not counted as users. These belong to a legal person, not a natural
          person, so they are out of GDPR scope - do NOT pseudonymize them:
          both call sites join against plaintext on-chain addresses, so hashing
          would break the exclusion for no privacy gain.

          Changes to this list silently move user counts. Treat edits as
          reviewable changes, not routine data updates.
        columns:
          - name: address
            data_type: String
            description: Company-operated wallet address (lowercase, 0x-prefixed).

      - name: gp_migrated_safes
        freshness: null
        description: >
          OLD -> NEW Safe mapping for the June 2026 post-exploit Gnosis Pay
          migration. One row per migrated Safe; a NEW Safe never appears as an
          OLD Safe, so a single hop resolves fully. Static dataset - the
          migration completed 2026-06-08 and no further rows are expected.

          Holds GnosisPay customer Safe addresses and is therefore SENSITIVE:
          it was previously a repo seed and must NOT be returned to one. This
          repo is public; the mapping is not derivable from public chain state
          (old and new Safes share no user-level owner by design, since the
          migration issued new signers), so publishing it would be a genuine
          disclosure rather than a convenience. See
          cerebro-mcp/docs/compliance/gdpr-audit-2026-07.md section 7.
        columns:
          - name: old_safe_address
            data_type: String
            description: Pre-migration Safe address.
          - name: new_safe_address
            data_type: String
            description: Post-migration (canonical) Safe address.
          - name: startedAt
            data_type: String
            description: Migration start timestamp (ISO-8601 string, as exported).
          - name: completedAt
            data_type: String
            description: Migration completion timestamp (ISO-8601 string, as exported).

