version: 2

sources:
  - name: crawlers_data
    description: "External datasets ingested by various crawlers (not consensus/execution authoritative state)."
    schema: crawlers_data
    tags: ["external", "crawlers", "enrichment"]
    freshness:
      warn_after: {count: 36, period: hour}
      error_after: {count: 72, period: hour}
    meta:
      owner: analytics_team
      authoritative: false

    tables:
      - name: country_codes
        freshness: null
        description: "ISO3166 country codes mapping."
        columns:
          - name: name
            data_type: String
          - name: alpha-2
            data_type: String
          - name: alpha-3
            data_type: String
          - name: country-code
            data_type: String
          - name: iso_3166-2
            data_type: String
          - name: region
            data_type: String
          - name: sub-region
            data_type: String
          - name: intermediate-region
            data_type: String
          - name: region-code
            data_type: String
          - name: sub-region-code
            data_type: String
          - name: intermediate-region-code
            data_type: String

      - name: ember_electricity_data
        freshness: null
        description: "Ember electricity statistics (daily)."
        columns:
          - name: Area
            data_type: String
          - name: ISO 3 code
            data_type: String
          - name: Date
            data_type: Date
          - name: Area type
            data_type: String
          - name: Continent
            data_type: String
          - name: Ember region
            data_type: String
          - name: EU
            data_type: Float64
          - name: OECD
            data_type: Float64
          - name: G20
            data_type: Float64
          - name: G7
            data_type: Float64
          - name: ASEAN
            data_type: Float64
          - name: Category
            data_type: String
          - name: Subcategory
            data_type: String
          - name: Variable
            data_type: String
          - name: Unit
            data_type: String
          - name: Value
            data_type: Float64
          - name: YoY absolute change
            data_type: Float64
          - name: YoY % change
            data_type: Float64

      - name: gpay_wallets
        freshness: null
        description: "Subset of SAFE wallet addresses discovered via gpay integration crawler."
        columns:
          - name: SAFE_address
            data_type: String
          - name: SAFE_createdAt
            data_type: DateTime

      - name: gpay_operational_wallets
        freshness: null
        description: >
          Gnosis Pay company-operated wallet addresses (treasury, relayers,
          settlement). Used purely as an EXCLUSION list so company wallets are
          not counted as users. These belong to a legal person, not a natural
          person, so they are out of GDPR scope - do NOT pseudonymize them:
          both call sites join against plaintext on-chain addresses, so hashing
          would break the exclusion for no privacy gain.

          Changes to this list silently move user counts. Treat edits as
          reviewable changes, not routine data updates.
        columns:
          - name: address
            data_type: String
            description: Company-operated wallet address (lowercase, 0x-prefixed).

      - name: gp_migrated_safes
        freshness: null
        description: >
          OLD -> NEW Safe mapping for the June 2026 post-exploit Gnosis Pay
          migration. One row per migrated Safe; a NEW Safe never appears as an
          OLD Safe, so a single hop resolves fully. Static dataset - the
          migration completed 2026-06-08 and no further rows are expected.

          Holds GnosisPay customer Safe addresses and is therefore SENSITIVE:
          it was previously a repo seed and must NOT be returned to one. This
          repo is public; the mapping is not derivable from public chain state
          (old and new Safes share no user-level owner by design, since the
          migration issued new signers), so publishing it would be a genuine
          disclosure rather than a convenience. See
          cerebro-mcp/docs/compliance/gdpr-audit-2026-07.md section 7.
        columns:
          - name: old_safe_address
            data_type: String
            description: Pre-migration Safe address.
          - name: new_safe_address
            data_type: String
            description: Post-migration (canonical) Safe address.
          - name: startedAt
            data_type: String
            description: Migration start timestamp (ISO-8601 string, as exported).
          - name: completedAt
            data_type: String
            description: Migration completion timestamp (ISO-8601 string, as exported).

      - name: ipinfo
        freshness: null
        description: "IP intelligence enrichment from ipinfo.io lookups."
        columns:
          - name: ip
            data_type: String
          - name: hostname
            data_type: String
          - name: city
            data_type: String
          - name: region
            data_type: String
          - name: country
