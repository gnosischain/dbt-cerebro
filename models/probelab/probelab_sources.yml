          - name: loc
            data_type: String
          - name: org
            data_type: String
          - name: postal
            data_type: String
          - name: timezone
            data_type: String
          - name: asn
            data_type: String
          - name: company
            data_type: String
          - name: carrier
            data_type: String
          - name: is_bogon
            data_type: Bool
          - name: is_mobile
            data_type: Bool
          - name: abuse_email
            data_type: String
          - name: abuse_phone
            data_type: String
          - name: error
            data_type: String
          - name: attempts
            data_type: UInt8
          - name: success
            data_type: Bool
          - name: created_at
            data_type: DateTime
          - name: updated_at
            data_type: DateTime

