version: 2

sources:
  - name: crawlers_data
    schema: crawlers_data
    freshness:
      warn_after: {count: 18, period: hour}
      error_after: {count: 30, period: hour}
    meta:
      owner: analytics_team
      authoritative: false
    tables:
      - name: dune_labels
        description: >
          Address→project labels crawled from Dune. One row per (address, label)
          observation with `introduced_at`; labels carry free-form suffixes that
          staging (stg_crawlers_data__dune_labels) normalizes into clean project
          names. Feeds int_crawlers_data_labels, the project_label entity spine.
        loaded_at_field: introduced_at
      # ClickHouse source freshness expects a timestamp, so cast the business
      # date to DateTime. Around the daily ~06:00 freshness run, a healthy
      # source should still top out at yesterday's date, so 36h/48h catches
      # a missing D-1 without false-alerting on normal daily cadence.
      - name: dune_prices
        description: >
          Daily token prices crawled from Dune. One row per (block_date, symbol)
          with a USD price; staging (stg_crawlers_data__dune_prices) dedupes to
          one price per date x upper(symbol) via anyLast. The platform-wide
          price feed until the native Chainlink oracle feed replaces it.
        loaded_at_field: "toDateTime(block_date)"
        freshness:
          warn_after: {count: 36, period: hour}
          error_after: {count: 48, period: hour}

      - name: dune_bridge_flows
        description: >
          Cross-chain bridge transfers crawled from Dune with bridge,
          source/dest chain, token and token/USD/net amounts. Two staging
          readers over this same table: stg_crawlers_data__dune_bridge_flows
          (transaction-level rows with timestamp) and the v2 reader
          (pre-aggregated daily grain with date + txs). Staging derives
          direction (in/out/xchain) relative to Gnosis.
        loaded_at_field: timestamp
      - name: dune_gno_supply
        description: >
          Daily GNO supply breakdown crawled from Dune. One row per
          (block_date, label) with the token supply attributed to that label
          bucket; passed through by stg_crawlers_data__dune_gno_supply.
        loaded_at_field: "toDateTime(block_date)"
        freshness:
          warn_after: {count: 36, period: hour}
          error_after: {count: 48, period: hour}
      - name: circles_blacklisted
        description: >
          Current Circles v2 bot/sybil blacklist. Ingested daily by click-runner
          (queries/circles/blacklist) from the aboutcircles bot-analytics API.
          The table is fully replaced on every run — there is no snapshot
          history; consumers that need point-in-time correctness should keep
          their blacklist join in a non-incremental downstream model so the
          latest state always re-applies.
        loaded_at_field: ingested_at
        freshness:
          warn_after: {count: 36, period: hour}
          error_after: {count: 48, period: hour}
        columns:
          - name: address
            description: Lowercase blacklisted avatar address.
          - name: reason
            description: Free-text reason from the upstream API (e.g. `repeated_username`, `duplicate_avatar`).
          - name: ingested_at
            description: Wall-clock timestamp of the row insert.

      - name: celo_gpay_transfers
        description: >
          Raw, UNCLASSIFIED whitelisted-token (USDT/USDC) ERC-20 transfers
          touching a Celo GP card Safe on either side. Deliberately not
          pre-classified here — Dune only does the extraction + wallet-
          membership + token-whitelist filtering that requires querying
          Celo chain data ClickHouse doesn't otherwise have; the actual
          Payment/Top-up/Withdrawal/Reversal classification happens in
          int_celo_gpay_activity.sql, mirroring how Gnosis Chain classifies
          from raw execution.logs rather than a pre-classified source. This
          keeps classification logic versioned/testable in dbt-cerebro
          instead of living in an external Dune query. Ingested by
          click-runner: a one-time full backfill since launch plus a daily
          3-day-lookback incremental job (tolerates the job not running for
          up to 2 days straight), both writing into the same
          ReplacingMergeTree table. Deduped via `OPTIMIZE ... FINAL` after
          every insert (see queries/celo_gpay/optimize_celo_gpay_transfers.sql)
          so the overlap window never double-counts on same-day reads.
        loaded_at_field: block_time
        freshness:
          warn_after: {count: 36, period: hour}
          error_after: {count: 48, period: hour}
        columns:
          - name: sender
            description: Transfer sender address (may or may not be a GP Safe — see int_celo_gpay_activity for which side is the Safe).
          - name: receiver
            description: Transfer receiver address (may or may not be a GP Safe).
          - name: token_symbol
            description: >
              USDT or USDC — the only tokens observed hitting the Celo
              settlement contract as of the 2026-06-29 dashboard audit.
              Anything else is filtered out upstream in Dune (spam/spoofed
              tokens sent directly to Safe addresses as noise).
          - name: amount_usd
            description: >
              USD value via Dune tokens.transfers.amount_usd. Nullable — a
              brief Dune price-feed gap should not fail ingestion; downstream
              SUM() skips nulls rather than treating them as zero.

      - name: celo_gpay_wallet_events
        description: >
          Unified, append-only wallet-lifecycle event log for Celo GP card
          Safes: issued_at (initial owner(s) at SafeSetup, one row per
          owner) + add_owner + remove_owner. Replaces the earlier separate
          celo_gpay_wallets (a per-safe snapshot table whose
          is_activated/first_spend_at/owner_address MUTATED in place on
          every daily refresh) and celo_gpay_owner_events tables — feedback
          from review was that any source where rows change value over
          time (not append-only) will break incremental models built on
          top of it, and this is not a hypothetical: an incremental model
          that already processed a row before a late-arriving fact caught
          up has no mechanism to revisit it. An append-only log has no
          row that can ever change, so it's immune to that failure class
          by construction rather than by careful, easy-to-forget
          engineering discipline (full-rebuild wallets + wide-enough
          incremental windows) elsewhere in the pipeline.
          first_spend_at/is_activated are deliberately NOT events here —
          derived in dbt directly from crawlers_data.celo_gpay_transfers
          instead (the fact is already fully present there — anything sent
          to the settlement address, the same definition the Dune spine
          itself uses for its own activation signal — so ingesting it
          separately would just store the same fact twice).
          Discovered while building this: GP's Celo provisioning flow
          commonly swaps a Safe's owner within seconds of SafeSetup —in the
          simplest observed case, the real EOA owner is removed and
          replaced with a hardcoded dead/sentinel address (0x...002),
          permanently disabling owner-based signing so only the
          Roles/Delay module can move funds; more complex multi-owner
          reconfigurations (1 remove + multiple adds) have also been
          observed, so this is real variation worth tracking as data, not
          a single deterministic rule to hardcode.
          int_celo_gpay_wallets.owner_address (identity) reads only the
          issued_at events and intentionally never reflects this later
          churn — mirrors Gnosis Chain's initial_owner vs current-owner
          split exactly (int_execution_gpay_user_identity_bridge vs
          int_execution_gpay_wallet_owners).
          Deliberately minimal columns — no tx_hash/log_index, since
          nothing downstream reads them; the current-owners fold's
          same-timestamp tie-break is resolved entirely in dbt (see
          int_celo_gpay_safe_current_owners.sql) without needing raw chain
          log metadata. Ingested by click-runner: a one-time full backfill
          since launch plus a daily 3-day-lookback incremental job (tolerates
          the job not running for up to 2 days straight), same shape as
          celo_gpay_transfers.
        loaded_at_field: event_time
        freshness:
          warn_after: {count: 36, period: hour}
          error_after: {count: 48, period: hour}
        columns:
          - name: safe_address
            description: The GP card Safe this event is about.
          - name: action
            description: "issued_at | add_owner | remove_owner."
          - name: action_value
            description: >
              The owner address involved — for issued_at, an initial
              SafeSetup owner (one row per owner if multi-owner); for
              add_owner/remove_owner, the owner being added or removed.
              Nullable: null for an issued_at row when SafeSetup hasn't
              been decoded yet (the Safe was recognized via the
              bridge-module or activation signal alone) — a genuinely
              unknown owner, not defaulted to an empty-string sentinel.
          - name: event_time
            description: On-chain timestamp of the event.

  # Separate source so the schema can be redirected (e.g. to playground_max)
  # during dev/backfill validation without also redirecting dune_* and the
  # other crawlers_data tables. Defaults to crawlers_data in prod.
  - name: crawlers_data_cow
    schema: "{{ env_var('DBT_COW_FEES_SCHEMA', 'crawlers_data') }}"
    meta:
      owner: analytics_team
      authoritative: false
    tables:
      - name: cow_api_trade_fees
        description: >
          Per-fill protocol fee data from the CoW Protocol API.
          Ingested by click-runner (cow ingestor). Keyed by
          (order_uid, tx_hash, log_index) — partially-fillable orders produce
          multiple trades per order_uid, each with its own executedProtocolFees.
          Covers 2023+ where CoW switched to surplus-based fees not visible in events.
        loaded_at_field: ingested_at
        freshness:
          warn_after: {count: 36, period: hour}
          error_after: {count: 48, period: hour}

  # External price standbein (DefiLlama + CoinGecko). Schema redirectable for
  # Max-dev (playground_max) via DBT_EXTERNAL_PRICES_SCHEMA; prod = crawlers_data.
  - name: crawlers_data_external_prices
    schema: "{{ env_var('DBT_EXTERNAL_PRICES_SCHEMA', 'crawlers_data') }}"
    meta:
      owner: analytics_team
      authoritative: false
    tables:
      - name: defillama_prices
        description: >
          External USD prices from DefiLlama coins API (gnosis:{address}).
          Ingested by click-runner external-prices ingestor (daily spot batch +
          optional ~365d chart backfill). Phase 1 standbein — not wired into
          int_execution_token_prices_daily until validated. Staging
          (stg_crawlers_data__defillama_prices) dedupes by date x symbol.
        loaded_at_field: ingested_at
        freshness:
          warn_after: {count: 36, period: hour}
          error_after: {count: 48, period: hour}
        columns:
          - name: block_date
            description: Calendar date of the price observation (UTC).
          - name: chain
            description: DefiLlama chain key (always gnosis for this ingest).
          - name: token_address
            description: Lowercase token contract address (or 0xeee… for native xDAI).
          - name: symbol
            description: Allowlist symbol from click-runner config.
          - name: price
            description: USD price from DefiLlama.
          - name: confidence
            description: DefiLlama confidence score in 0–1 (nullable metadata).
          - name: ingested_at
            description: Wall-clock timestamp of the insert.

      - name: coingecko_prices
        description: >
          External USD prices from the CoinGecko public/Demo API (by coin id).
          Ingested by click-runner external-prices ingestor. Phase 1 standbein —
          not wired into the price hub until validated. Staging
          (stg_crawlers_data__coingecko_prices) dedupes by date x symbol.
        loaded_at_field: ingested_at
        freshness:
          warn_after: {count: 36, period: hour}
          error_after: {count: 48, period: hour}
        columns:
          - name: block_date
            description: Calendar date of the price observation (UTC).
          - name: coingecko_id
            description: CoinGecko coin id (e.g. gnosis, savings-xdai).
          - name: symbol
            description: Allowlist symbol from click-runner config.
          - name: price
            description: USD price from CoinGecko.
          - name: ingested_at
            description: Wall-clock timestamp of the insert.

  # Separate source so the schema can be redirected (e.g. to playground_max)
  # during dev/backfill validation without also redirecting dune_* and the
  # other crawlers_data tables. Defaults to crawlers_data in prod.
  #
  # Redirecting matters here because ipinfo is the one crawlers_data table a
  # developer can populate themselves: `ip_crawler --source hopr` writes it, and
  # dev accounts cannot write crawlers_data. Without this, a dev enrichment run
  # is invisible to dbt.
  #
  # NOTE the blast radius: stg_crawlers_data__ipinfo also feeds the p2p models
  # (int_p2p_discv4_peers, int_p2p_discv5_peers and both topology models). A dev
  # schema holding only HOPR IPs makes those look devoid of geography, so set
  # DBT_IPINFO_SCHEMA for HOPR work only and unset it before building p2p.
  - name: crawlers_data_ipinfo
    schema: "{{ env_var('DBT_IPINFO_SCHEMA', 'crawlers_data') }}"
    meta:
      owner: analytics_team
      authoritative: false
    tables:
      - name: ipinfo
        freshness: null
        description: "IP intelligence enrichment from ipinfo.io lookups."
        columns:
          - name: ip
            data_type: String
          - name: hostname
            data_type: String
          - name: city
            data_type: String
          - name: region
            data_type: String
          - name: country
            data_type: String
          - name: loc
            data_type: String
          - name: org
            data_type: String
          - name: postal
            data_type: String
          - name: timezone
            data_type: String
          - name: asn
            data_type: String
          - name: company
            data_type: String
          - name: carrier
            data_type: String
          - name: is_bogon
            data_type: Bool
          - name: is_mobile
            data_type: Bool
          - name: abuse_email
            data_type: String
          - name: abuse_phone
            data_type: String
          - name: error
            data_type: String
          - name: attempts
            data_type: UInt8
          - name: success
            data_type: Bool
          - name: created_at
            data_type: DateTime
          - name: updated_at
            data_type: DateTime

  # HOPR feeds ingested by click-runner (hopr_network_ingestor, hopr_blokli_ingestor).
  # click-runner writes these to {{HOPR_DATABASE}}, which is hopr_db in prod -- their own
  # database, NOT crawlers_data (decided 2026-08-18; the crawlers_data copies were
  # dropped). This is the one crawlers_data_* source that does not live in crawlers_data,
  # so unlike crawlers_data_ipinfo above the default here is hopr_db. Point
  # DBT_HOPR_SCHEMA at another database to build against a local ingest.
  #
  # All four are ReplacingMergeTree(ingested_at) and re-running a day supersedes that
  # day's rows, so every staging model over them reads FINAL -- without it a re-run
  # silently double-counts. The tables are small enough that FINAL is free.
  #
  # Coverage is NOT uniform and the two feeds do not overlap:
  #   - the prober feeds (hopr_network_*) are dufour only; the prober was never
  #     ported to v4, so there is no liveness signal for jura.
  #   - blokli (hopr_blokli_*) serves jura and rotsee but NOT dufour.
  # rotsee is a testnet -- its ticket price and balances are not real economics.
  - name: crawlers_data_hopr
    schema: "{{ env_var('DBT_HOPR_SCHEMA', 'hopr_db') }}"
    meta:
      owner: analytics_team
      authoritative: false
    tables:
      - name: hopr_network_online_hourly
        freshness: null
        description: >
          Hourly count of online HOPR nodes from the network.hoprnet.org dashboard's own
          history. Backfilled in one call (the API returns the whole series), so it needs
          no daily run and carries history from 2023-09 that no other feed has. The series
          is NOT gap-free -- roughly a fifth of expected hours are absent -- so consumers
          must count observed hours rather than assume 24 per day.
        columns:
          - name: network_id
            data_type: UInt16
          - name: observed_at
            data_type: DateTime
          - name: nodes_online
            data_type: UInt32
          - name: ingested_at
            data_type: DateTime
      - name: hopr_network_nodes
        freshness: null
        description: >
          Daily per-node quality snapshot from the dashboard prober (dufour only).
          node_address is the on-chain address and joins directly to decoded
          HoprChannels source/destination. latency_ms is NULL for nodes the prober
          cannot reach -- that is the reachability signal, not missing data.
          availability_1y is currently NULL for every node.
        columns:
          - name: snapshot_date
            data_type: Date
          - name: network_id
            data_type: UInt16
          - name: node_address
            data_type: String
          - name: latency_ms
            data_type: Nullable(Float64)
          - name: availability_24h
            data_type: Nullable(Float64)
          - name: availability_7d
            data_type: Nullable(Float64)
          - name: availability_30d
            data_type: Nullable(Float64)
          - name: availability_6m
            data_type: Nullable(Float64)
          - name: availability_1y
            data_type: Nullable(Float64)
          - name: first_seen
            data_type: Nullable(DateTime)
          - name: last_seen
            data_type: Nullable(DateTime)
          - name: prober_last_run
            data_type: Nullable(DateTime)
          - name: ingested_at
            data_type: DateTime
      - name: hopr_blokli_nodes
        freshness: null
        description: >
          Per-node identity snapshot from blokli, HOPR's own v4 indexer (jura and rotsee).
          chain_key is the on-chain node address; packet_key and keyid exist only here.
          multiaddress carries the announced transport address including a raw IP.
        columns:
          - name: snapshot_date
            data_type: Date
          - name: network
            data_type: LowCardinality(String)
          - name: keyid
            data_type: UInt32
          - name: chain_key
            data_type: String
          - name: packet_key
            data_type: String
          - name: safe_address
            data_type: String
          - name: multiaddress
            data_type: String
          - name: multiaddress_count
            data_type: UInt8
          - name: ingested_at
            data_type: DateTime
      - name: hopr_blokli_network_snapshot
        freshness: null
        description: >
          Daily network-level snapshot from blokli: live protocol parameters (ticket
          price, minimum winning probability, key binding fee, closure grace period) plus
          account/safe/channel counts and balances. The only source of jura economics and
          staked balances that needs no balance indexing. Forward-only -- no history
          before the ingestor first ran.
        columns:
          - name: snapshot_date
            data_type: Date
          - name: network
            data_type: LowCardinality(String)
          - name: chain_id
            data_type: UInt32
          - name: block_number
            data_type: UInt64
          - name: api_version
            data_type: String
          - name: ticket_price_wxhopr
            data_type: Nullable(Float64)
          - name: min_ticket_winning_probability
            data_type: Float64
          - name: key_binding_fee_wxhopr
            data_type: Nullable(Float64)
          - name: channel_closure_grace_period_s
            data_type: UInt32
          - name: account_count
            data_type: UInt32
          - name: safes_count
            data_type: UInt32
          - name: safes_balance_wxhopr
            data_type: Nullable(Float64)
          - name: channels_total
            data_type: UInt32
          - name: channels_balance_wxhopr
            data_type: Nullable(Float64)
          - name: channels_open
            data_type: UInt32
          - name: channels_open_balance_wxhopr
            data_type: Nullable(Float64)
          - name: channels_pendingtoclose
            data_type: UInt32
          - name: channels_pendingtoclose_balance_wxhopr
            data_type: Nullable(Float64)
          - name: channels_closed
            data_type: UInt32
          - name: channels_closed_balance_wxhopr
            data_type: Nullable(Float64)
          - name: ingested_at
            data_type: DateTime

      # ──────────────── ProbeLab rollups ────────────────
      # ProbeLab rollup tables use Nullable timestamps — exempt from freshness
