version: 2
models:

- name: api_execution_state_full_size_daily
  description: The api_execution_state_full_size_daily model provides daily aggregated data on the size of API execution states, facilitating trend analysis and capacity planning. Deprecated 2026-08 - execution.storage_diffs ingestion ended 2026-01-30, so the series is frozen at that date.
  columns:

  - name: date
    description: The specific calendar date for the recorded data point.
    data_type: Date
    tests:
    - not_null:
        config:
          where: "{% if var('test_full_refresh', false) %}1=1{% else %}toDate(date) >= today() - {{ var('test_lookback_days', 7) }}{% endif %}"
  - name: value
    description: The size of the execution state in gigabytes, calculated by dividing bytes by 10^9.
    data_type: Float64
  meta:
    owner: analytics_team
    authoritative: false
    api:
      exclude_from_api: true
- name: fct_execution_state_full_size_daily
  description: The fct_execution_state_full_size_daily model aggregates daily cumulative bytes of execution state data, providing insights into storage size trends over time for operational monitoring. Deprecated 2026-08 - execution.storage_diffs ingestion ended 2026-01-30, so the series is frozen at that date.
  columns:

  - name: date
    description: The date for which the size data is recorded, representing a daily timestamp.
    data_type: Date
    tests:
    - not_null:
        config:
          where: "{% if var('test_full_refresh', false) %}1=1{% else %}toDate(date) >= today() - {{ var('test_lookback_days', 7) }}{% endif %}"
  - name: bytes
    description: The total cumulative size in bytes of execution state data up to the specified date.
    data_type: UInt64
  meta:
    owner: analytics_team
    authoritative: false
