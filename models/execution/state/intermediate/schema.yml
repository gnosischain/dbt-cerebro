version: 2
models:

- name: int_execution_state_size_full_diff_daily
  description: This model calculates the daily net change in storage size for execution states by aggregating storage diffs, supporting incremental updates for performance analysis. Deprecated 2026-08 - execution.storage_diffs ingestion ended 2026-01-30, so the series is frozen at that date.
  columns:

  - name: date
    description: The specific day for which the storage size difference is calculated, truncated to the start of the day.
    data_type: DateTime64
    tests:
    - not_null:
        config:
          where: "{% if var('test_full_refresh', false) %}1=1{% else %}toDate(date) >= today() - {{ var('test_lookback_days', 7) }}{% endif %}"
  - name: bytes_diff
    description: The net change in storage size in bytes for the day, where positive indicates an increase and negative indicates a decrease.
    data_type: UInt64
  meta:
    owner: analytics_team
    authoritative: false
  tests:
  - dbt_utils.unique_combination_of_columns:
      combination_of_columns:
      - date
      config:
        where: "{% if var('test_full_refresh', false) %}1=1{% else %}toDate(date) >= today() - {{ var('test_lookback_days', 7) }}{% endif %}"
