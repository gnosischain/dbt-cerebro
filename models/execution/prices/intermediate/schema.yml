version: 2
models:

- name: int_execution_token_prices_daily
  description: >
    Hybrid daily USD price hub. Priority: fresh native (1) > backedfi RWA /
    aToken wrappers (2) > off-chain pick DefiLlama(confidence>=0.9) >
    CoinGecko > Dune (3) > $1 pegs (4) > stale native (5).
  columns:

  - name: date
    description: The date for which the price data is recorded, formatted as a date.
    data_type: Date

  - name: symbol
    description: The token or stablecoin symbol. When available, this uses the preferred presentation format from the `tokens_whitelist` seed (e.g. `USDC.e`, `EURe`, `xDAI`).
    data_type: String

  - name: price
    description: The recorded price of the token in USD, represented as a floating-point number.
    data_type: Float64
  meta:
    owner: analytics_team
    authoritative: false
  tests:
  - elementary.volume_anomalies:
      timestamp_column: date
      time_bucket:
        period: day
        count: 1
      training_period:
        period: day
        count: 56
      seasonality: day_of_week
      detection_period:
        period: day
        count: 2
      detection_delay:
        period: day
        count: 1
      anomaly_sensitivity: 3
      ignore_small_changes:
        spike_failure_percent_threshold: 10
        drop_failure_percent_threshold: 20
      severity: warn
      tags:
      - elementary
  - elementary.freshness_anomalies:
      timestamp_column: date
      time_bucket:
        period: day
        count: 1
      severity: warn
      tags:
      - elementary
  - elementary.schema_changes:
      severity: warn
      tags:
      - elementary
  - dbt_utils.unique_combination_of_columns:
      combination_of_columns:
      - date
      - symbol
      config:
        where: "{% if var('test_full_refresh', false) %}1=1{% else %}toDate(date) >= today() - {{ var('test_lookback_days', 7) }}{% endif %}"

- name: int_execution_prices_oracle_daily
  description: >
    Daily native USD prices derived from Chainlink on-chain oracle feeds
    (AnswerUpdated events) for whitelisted tokens. One Chainlink feed per token
    symbol; the latest answer of each day (argMax over block_timestamp) divided
    by the feed's decimals. This is the native USD anchor intended to replace the
    externally-ingested Dune price feed; see docs/native_token_prices_build_plan.md.
  columns:

  - name: symbol
    description: The token symbol priced by the feed (e.g. GNO, WETH, EURe, ZCHF).
    data_type: String

  - name: date
    description: The calendar day (start-of-day) for the recorded price.
    data_type: DateTime64(0, 'UTC')
    tests:
    - not_null:
        config:
          where: "{% if var('test_full_refresh', false) %}1=1{% else %}toDate(date) >= today() - {{ var('test_lookback_days', 7) }}{% endif %}"

  - name: price
    description: The latest oracle USD price for the token on the given day (answer / 10^decimals).
    data_type: Float64
  meta:
    owner: analytics_team
    authoritative: false
    agent:
      grain: [date, symbol]
      semantics: snapshot
      invariants:
      - id: one-price-per-feed-day
        text: Exactly one row per (date, symbol); the price is the day's LAST oracle
          answer and must be > 0.
      - id: green-run-not-fresh
        text: >-
          A green run proves nothing about freshness — the model reprocesses whatever
          the decode holds; when the upstream aggregator set rotates, max(date) freezes
          while runs stay green. Check max(date) against today before trusting output.
      hazards: [oracle-aggregator-rotation-silent-halt, staged-insert-overwrite-wipe]
      ground_truth: latestRoundData()/description() on the current phase aggregators;
        int_execution_token_prices_compare vs off-chain feeds
      reprocess_runbook: >-
        insert_overwrite partitioned by month with start_month/end_month vars — the
        window must be whole months (partition grain = overwrite grain); never staged
        batches or slice vars.
    full_refresh:
      start_date: "2021-01-01"
      batch_months: 2
      stages:
      - name: all
  tests:
  - elementary.volume_anomalies:
      timestamp_column: date
      time_bucket:
        period: day
        count: 1
      training_period:
        period: day
        count: 56
      seasonality: day_of_week
      detection_period:
        period: day
        count: 2
      detection_delay:
        period: day
        count: 1
      anomaly_sensitivity: 3
      ignore_small_changes:
        spike_failure_percent_threshold: 10
        drop_failure_percent_threshold: 20
      severity: warn
      tags:
      - elementary
  - elementary.freshness_anomalies:
      timestamp_column: date
      time_bucket:
        period: day
        count: 1
      severity: warn
      tags:
      - elementary
  - elementary.schema_changes:
      severity: warn
      tags:
      - elementary
  - dbt_utils.unique_combination_of_columns:
      combination_of_columns:
      - date
      - symbol
      config:
        where: "{% if var('test_full_refresh', false) %}1=1{% else %}toDate(date) >= today() - {{ var('test_lookback_days', 7) }}{% endif %}"

- name: int_execution_prices_dex_ratios
  description: >
    Daily DEX-derived USD prices for whitelist tokens that have no Gnosis Chainlink
    feed (GBPe, BRLA, BRZ, COW, SAFE). Median over trades where the token is swapped
    against an oracle-priced anchor token (implied_usd = anchor_amount * anchor_usd /
    target_amount), requiring >= $1000 notional and >= 5 trades/day. Sourced from the
    UNPRICED trade tables (pools_dex_trades_raw + stg_cow__trades) to avoid a cycle
    with the price hub; the USD anchor is int_execution_prices_oracle_daily.
  columns:

  - name: symbol
    description: The whitelist token symbol being priced (GBPe, BRLA, BRZ, COW, SAFE).
    data_type: String

  - name: date
    description: The calendar day for the recorded price.
    data_type: Date
    tests:
    - not_null:
        config:
          where: "{% if var('test_full_refresh', false) %}1=1{% else %}toDate(date) >= today() - {{ var('test_lookback_days', 7) }}{% endif %}"

  - name: price
    description: Daily median implied USD price across qualifying DEX/CoW trades.
    data_type: Float64

  - name: n_trades
    description: Number of qualifying trades that contributed to the daily median.
    data_type: UInt64
  meta:
    owner: analytics_team
    authoritative: false
    full_refresh:
      start_date: "2022-04-01"
      batch_months: 1
      stages:
      - name: all
  tests:
  - elementary.schema_changes:
      severity: warn
      tags:
      - elementary
  - dbt_utils.unique_combination_of_columns:
      combination_of_columns:
      - date
      - symbol
      config:
        where: "{% if var('test_full_refresh', false) %}1=1{% else %}toDate(date) >= today() - {{ var('test_lookback_days', 7) }}{% endif %}"

- name: int_execution_prices_native_daily
  description: >
    Native daily USD price series for whitelist base tokens, assembled from on-chain
    data to replace the Dune feed: Chainlink oracle prices (authoritative) + sDAI
    ERC4626 vault rate + sGNO + DEX-derived stablecoins (GBPe/BRLA/BRZ/COW/SAFE, with
    30-day rolling-MAD outlier nulling and BRZ<-BRLA fallback), forward-filled across a
    daily calendar so every symbol is dense. Drop-in for the hub's source CTE; the hub
    still layers aTokens (lending_market_mapping) and RWA (backedfi) on top. Full-rebuild
    table. See docs/native_token_prices_build_plan.md.
  columns:

  - name: date
    description: The calendar day for the recorded price.
    data_type: Date
    tests:
    - not_null:
        config:
          where: "{% if var('test_full_refresh', false) %}1=1{% else %}toDate(date) >= today() - {{ var('test_lookback_days', 7) }}{% endif %}"

  - name: symbol
    description: The whitelist token symbol (base tokens; aTokens/RWA are added by the hub).
    data_type: String

  - name: price
    description: Forward-filled native USD price for the token on the given day.
    data_type: Float64

  - name: last_obs_date
    description: >
      Date of the last REAL (non-forward-filled) observation backing this row's price.
      On a day with a fresh observation this equals `date`; on a forward-filled day it is
      the most recent real-observation date. The hub uses `date - last_obs_date` to demote
      a stale native price below the off-chain fallback (see int_execution_token_prices_daily).
    data_type: Date
  meta:
    owner: analytics_team
    authoritative: false
  tests:
  - elementary.volume_anomalies:
      timestamp_column: date
      time_bucket:
        period: day
        count: 1
      training_period:
        period: day
        count: 56
      seasonality: day_of_week
      detection_period:
        period: day
        count: 2
      detection_delay:
        period: day
        count: 1
      anomaly_sensitivity: 3
      ignore_small_changes:
        spike_failure_percent_threshold: 10
        drop_failure_percent_threshold: 20
      severity: warn
      tags:
      - elementary
  - elementary.freshness_anomalies:
      timestamp_column: date
      time_bucket:
        period: day
        count: 1
      severity: warn
      tags:
      - elementary
  - elementary.schema_changes:
      severity: warn
      tags:
      - elementary
  - dbt_utils.unique_combination_of_columns:
      combination_of_columns:
      - date
      - symbol
      config:
        where: "{% if var('test_full_refresh', false) %}1=1{% else %}toDate(date) >= today() - {{ var('test_lookback_days', 7) }}{% endif %}"

- name: int_execution_token_prices_external_daily
  description: >
    Long-form external USD prices (DefiLlama + CoinGecko) for allowlisted tokens.
    Fed into int_execution_token_prices_daily off-chain pick (priority 3) when
    confidence gates pass; also used by int_execution_token_prices_compare for QA.
  columns:
  - name: date
    description: Calendar date of the price observation (UTC).
    data_type: Date
  - name: symbol
    description: Token symbol (whitelist display casing when available).
    data_type: String
  - name: source
    description: External provider — `defillama` or `coingecko`.
    data_type: String
  - name: price
    description: USD price from the external provider.
    data_type: Float64
  - name: confidence
    description: DefiLlama confidence (0–1); null for CoinGecko.
    data_type: Nullable(Float64)
  meta:
    owner: analytics_team
    authoritative: false
  tests:
  - dbt_utils.unique_combination_of_columns:
      combination_of_columns:
      - date
      - symbol
      - source
      config:
        where: "{% if var('test_full_refresh', false) %}1=1{% else %}toDate(date) >= today() - {{ var('test_lookback_days', 7) }}{% endif %}"

- name: int_execution_token_prices_compare
  description: >
    Side-by-side daily prices from native, hub, Dune, DefiLlama, and CoinGecko
    with pairwise absolute percentage diffs. Validation / QA only. After Phase 2a,
    hub already prefers high-confidence Llama over Dune at priority 3 — large
    hub-vs-Llama gaps on RWAs are expected (backedfi stays priority 2).
  columns:
  - name: date
    description: Calendar date.
    data_type: Date
  - name: symbol
    description: Token symbol (whitelist display casing when available).
    data_type: String
  - name: price_native
    description: Price from int_execution_prices_native_daily.
    data_type: Nullable(Float64)
  - name: price_hub
    description: Price from int_execution_token_prices_daily (official series).
    data_type: Nullable(Float64)
  - name: price_dune
    description: Price from stg_crawlers_data__dune_prices.
    data_type: Nullable(Float64)
  - name: price_defillama
    description: Price from DefiLlama external ingest.
    data_type: Nullable(Float64)
  - name: price_coingecko
    description: Price from CoinGecko external ingest.
    data_type: Nullable(Float64)
  - name: abs_pct_diff_native_defillama
    description: abs(native - defillama) / native when both present.
    data_type: Nullable(Float64)
  - name: abs_pct_diff_native_coingecko
    description: abs(native - coingecko) / native when both present.
    data_type: Nullable(Float64)
  - name: abs_pct_diff_dune_defillama
    description: abs(dune - defillama) / dune when both present.
    data_type: Nullable(Float64)
  - name: abs_pct_diff_dune_coingecko
    description: abs(dune - coingecko) / dune when both present.
    data_type: Nullable(Float64)
  - name: abs_pct_diff_defillama_coingecko
    description: abs(defillama - coingecko) / defillama when both present.
    data_type: Nullable(Float64)
  - name: abs_pct_diff_hub_defillama
    description: abs(hub - defillama) / hub when both present.
    data_type: Nullable(Float64)
  - name: source_count
    description: Count of non-null among native, dune, defillama, coingecko.
    data_type: UInt8
  meta:
    owner: analytics_team
    authoritative: false
  tests:
  - dbt_utils.unique_combination_of_columns:
      combination_of_columns:
      - date
      - symbol
      config:
        where: "{% if var('test_full_refresh', false) %}1=1{% else %}toDate(date) >= today() - {{ var('test_lookback_days', 7) }}{% endif %}"
