version: 2

models:
  - name: fct_hopr_network_daily
    description: >
      Daily HOPR channel activity per network, split by is_cover_traffic. THE SPLIT
      IS THE POINT: on dufour, nearly every ChannelOpened event comes from the ten
      cover-traffic nodes HOPR publishes in ct-research -- the overwhelming majority
      in every year dufour has been live -- and the config's 48-hour channel max_age
      is what generates almost all observed churn. Cover traffic is HOPR paying node runners in proportion to
      stake -- a staking rewards programme -- so summing across the split would
      present a rewards schedule as user demand. jura carries no cover traffic.
    columns:
      - name: network
        data_type: LowCardinality(String)
        tests:
          - not_null
          - accepted_values:
              values: ['dufour', 'jura', 'rotsee']
      - name: activity_date
        data_type: Date
        tests: [not_null]
      - name: is_cover_traffic
        description: 1 where the channel source is a known HOPR cover-traffic node
        data_type: UInt8
        tests:
          - not_null
          - accepted_values:
              values: [0, 1]
      - name: redeemed_wxhopr
        description: Value redeemed by relayers, reconstructed from balance diffs
        data_type: Decimal(38, 18)
      - name: tickets_redeemed
        data_type: UInt64
        tests: [not_null]

  - name: fct_hopr_network_health_daily
    description: >
      Daily HOPR network health per network: how many nodes have ever registered
      on-chain, versus how many are actually up.

      THE GAP BETWEEN THOSE IS THE POINT. On-chain registration is cumulative and never
      expires, so a node that ran once in 2023 and vanished still counts in
      nodes_registered_cumulative forever; the prober and the dashboard's online series
      measure the live network. The two have diverged every year -- roughly 1.6x apart
      in 2023 and 3.5x by 2026, as registrations accumulate while the live network
      shrinks. Both columns sit side by side specifically so a chart cannot show one
      while implying the other, and neither should ever be labelled "network size"
      without saying which it is.

      Coverage is asymmetric. nodes_online_* reaches back to 2023-09 from the dashboard
      history; the prober columns start only when click-runner's hopr-network ingestor
      first ran and are NULL before that, meaning unmeasured, never zero. Both prober
      feeds are dufour-only, so jura carries registration counts and nothing else --
      jura's missing liveness is the prober never having been ported to v4, not jura
      being down.
    meta:
      owner: analytics_team
      authoritative: false
      agent:
        grain: [network, date]
        semantics: daily_snapshot
        ground_truth: >-
          Cumulative registrations from decoded HoprAnnouncements KeyBinding events;
          liveness from the network.hoprnet.org dashboard history and prober, ingested
          by click-runner into the hopr_db source.
        invariants:
        - id: one-row-per-network-date
          text: >-
            Grain is (network, date); count() must equal uniqExact((network, date)).
            The date spine is a UNION DISTINCT of the three inputs' own dates, so a
            duplicate means an input started emitting more than one row per day.
        - id: registered-and-online-are-not-interchangeable
          text: >-
            nodes_registered_cumulative counts nodes that ever key-bound and never
            decrements. nodes_online_avg counts nodes up on the day. Presenting the
            first as network size overstates HOPR several-fold, and the factor grows
            every year. Any single "node count" on a dashboard must name which one.
        - id: bare-hex-vs-prefixed-address-join
          text: >-
            The registrations CTE joins decoded events to contracts_hopr_registry.
            execution.logs carries addresses as BARE hex while the registry stores them
            0x-prefixed, so the join must strip the prefix
            (lower(contract_address) = replaceAll(r.address, '0x', '')). Joining raw
            matches nothing, yields a cumulative count of zero for every date, and
            still builds green -- this exact failure happened during development.
        - id: hours-observed-is-load-bearing
          text: >-
            The dashboard's hourly history is missing a substantial share of its hours,
            so a day can rest on anything from one observation to twenty-four. Read
            nodes_online_avg together with hours_observed and drop or flag thin days;
            averaging them as equal to full days silently overweights sparse periods.
        - id: null-means-unmeasured
          text: >-
            NULL in any prober column means no measurement existed for that day, never
            zero nodes. coalescing them to 0 would invent an outage across the whole
            span before the ingestor started.
        hazards: [ch-left-join-nulls, stale-snapshot-caveat, decode-watermark-late-logs]
        validation:
        - 'count() - uniqExact((network, date)) == 0'
        - 'registrations are non-zero: max(nodes_registered_cumulative) > 0'
        - 'cumulative never decreases: no row where nodes_registered_cumulative < previous within network'
        - 'online implies observation: countIf(nodes_online_avg IS NOT NULL AND hours_observed = 0) == 0'
        reprocess_runbook: >-
          Plain `dbt run --select fct_hopr_network_health_daily` - it is a small table
          rebuilt whole with no watermark. Rebuild after the click-runner HOPR ingestors
          run or after any Announcements decode change. Set DBT_HOPR_SCHEMA to the
          database holding the click-runner tables when building outside prod.
    columns:
      - name: network
        description: HOPR network; dufour, or jura for registration counts only.
        data_type: String
        tests: [not_null]
      - name: date
        description: Calendar day, UTC.
        data_type: Date
        tests: [not_null]
      - name: nodes_registered_new
        description: >
          Nodes whose first KeyBinding fell on this date. KeyBinding is the act of
          joining the network; AddressAnnouncement repeats whenever a node re-announces
          an address, so it dates announcements rather than registrations.
        data_type: UInt64
      - name: nodes_registered_cumulative
        description: >
          Running total of nodes ever registered on this network up to and including
          this date. Never decrements -- deregistration and abandonment are invisible
          to it. This is NOT the live network size.
        data_type: UInt64
      - name: nodes_online_avg
        description: >
          Mean of the dashboard's hourly online count across the hours observed that
          day. NULL where the dashboard history has no hours at all. Always read with
          hours_observed.
        data_type: Nullable(Float64)
      - name: nodes_online_min
        description: Lowest hourly online count observed that day.
        data_type: Nullable(UInt32)
      - name: nodes_online_max
        description: Highest hourly online count observed that day.
        data_type: Nullable(UInt32)
      - name: hours_observed
        description: >
          Distinct hours the dashboard actually recorded that day, 0 to 24. The history
          is far from complete, so this is how a consumer tells a well-observed day from
          a single-sample one. Zero means the online columns are NULL.
        data_type: UInt64
      - name: nodes_probed
        description: >
          Nodes the prober attempted that day. NULL before the ingestor started and for
          every jura row. Consistently far below nodes_registered_cumulative, because
          the prober tracks the live set rather than the historical registry.
        data_type: Nullable(UInt64)
      - name: nodes_reachable
        description: Nodes the prober actually reached, i.e. that returned a latency.
        data_type: Nullable(UInt64)
      - name: nodes_high_availability
        description: >
          Nodes up at least 90% of the last 24 hours. Kept apart from nodes_reachable
          because a node can answer one probe while being down most of the day.
        data_type: Nullable(UInt64)
      - name: avg_latency_ms
        description: Mean round-trip time across reachable nodes, milliseconds.
        data_type: Nullable(Float64)
      - name: p50_latency_ms
        description: >
          Median round-trip time across reachable nodes. Materially below the mean --
          a long tail of slow nodes pulls the average up, so the median is the better
          headline.
        data_type: Nullable(Float64)
      - name: avg_availability_24h
        description: Mean 24-hour availability across all probed nodes, in [0,1].
        data_type: Nullable(Float64)

  - name: api_gnosisvpn_exit_activity_daily
    description: >
      GnosisVPN traffic by exit node and country, per day -- the SUPPLY side of
      the product. Works because the exit-node roster is committed to git
      (gnosis/gnosis_vpn linux/resources/config-jura.toml) with an address, city
      and country per destination. Scoped to jura, which carries no cover traffic.
      The demand side -- how many clients exist and how many actually used it --
      is api_hopr_gnosisvpn_users_daily; neither answers the other's question.
      Three caveats travel with this data. Tickets are probabilistic payments,
      proportional to relayed volume in expectation but NOT a bandwidth
      measurement (real bytes live only in node-local Prometheus metrics).
      Channel counts track how many clients are running, not usage, because the
      client auto-maintains channels toward target_open_channels -- read
      tickets_redeemed for usage. And the city/country labels are product
      metadata, not verified geography: the announced IPs cluster in one
      185.9.1.0/24 block plus Google Cloud ranges.
      The exit roster is a static git snapshot, so it goes stale silently as HOPR
      adds exits -- unlike int_hopr_vpn_clients, which is derived structurally.
    meta:
      owner: analytics_team
      authoritative: false
    columns:
      - name: date
        description: >
          Day of the relayed activity. Named date, not activity_date, because a
          served granularity:daily endpoint must expose its grain under that name.
        data_type: Date
        tests: [not_null]
      - name: country_code
        description: ISO-3166 alpha-2 of the exit node's advertised location.
        data_type: LowCardinality(String)
        tests: [not_null]
      - name: location_city
        description: City the exit advertises. Product metadata, not verified geography.
        data_type: String
      - name: exit_label
        description: Human label for the exit from the GnosisVPN client config.
        data_type: String
      - name: tickets_redeemed
        description: >
          Redeemed tickets on channels terminating at this exit. The usage series --
          proportional to relayed traffic in expectation, not a byte count.
        data_type: UInt64
        tests: [not_null]
      - name: redeemed_wxhopr
        description: wxHOPR paid out to this exit, from channel balance decreases.
        data_type: Decimal(38, 18)
      - name: channels_opened
        description: >
          Channels opened toward this exit. Tracks clients running, NOT demand --
          the client auto-maintains channels toward target_open_channels.
        data_type: UInt64
      - name: channels_closed
        description: Channels closed toward this exit on this day.
        data_type: UInt64
      - name: unique_counterparty_nodes
        description: >
          Distinct nodes funding channels toward this exit. An upper bound on
          running clients, not a user count -- one operator can run many nodes,
          and this is per-exit so it cannot be summed across exits.
        data_type: UInt64
      - name: channels_seen
        description: Distinct channels observed toward this exit on this day.
        data_type: UInt64

  - name: fct_hopr_gnosisvpn_users_daily
    description: >
      GnosisVPN client activity per network per day, on a dense date spine -- the
      DEMAND side. Publishes two user definitions side by side and they are not
      interchangeable. active_users_* mirrors HOPR's own published definition (a
      client is active if it redeemed a ticket OR first key-bound in the window)
      and is the one to quote against their figures. using_users_* counts
      redemptions only, i.e. whether the product was actually used. The difference
      between them is the deployed-but-never-used cohort.
      The 30d window is 31 days inclusive while the 7d window is 7 -- an asymmetry
      copied deliberately from HOPR's query so the numbers line up; see the model
      header for why it is reproduced rather than corrected.
      There is no bandwidth column, by design: tickets are probabilistic payments,
      not bytes. rotsee (testnet) is excluded.
    meta:
      owner: analytics_team
      authoritative: false
      agent:
        grain: [network, date]
        semantics: daily_snapshot
        invariants:
        - id: one-row-per-network-day
          text: >-
            count() - uniqExact((network, date)) must be 0. The spine is dense, so
            a quiet day is a zero row, never a missing one.
        - id: using-never-exceeds-active
          text: >-
            using_users_N is a strict subset of active_users_N by construction
            (redemptions only, versus redemptions plus deployments). Any row where
            using > active means the window predicates have drifted apart.
        - id: windows-are-nested
          text: >-
            active_users_7d <= active_users_30d on every row; likewise for using_*.
            A wider window cannot contain fewer distinct clients.
        - id: no-testnet-rows
          text: >-
            rotsee must never appear. Its clients are test deployments and would
            multiply the apparent user base.
        hazards: [ch-left-join-nulls, decode-watermark-late-logs]
        validation:
        - 'count() - uniqExact((network, date)) == 0'
        - 'countIf(using_users_30d > active_users_30d) == 0'
        - 'countIf(active_users_7d > active_users_30d) == 0'
        - "countIf(network = 'rotsee') == 0"
        reprocess_runbook: >-
          Plain `dbt run -s fct_hopr_gnosisvpn_users_daily`. It is a table over
          small inputs, so a rebuild is cheap and idempotent; rebuild
          int_hopr_vpn_clients first if the decode layer changed.
    columns:
      - name: network
        description: HOPR network. rotsee is excluded, so dufour or jura.
        data_type: LowCardinality(String)
        tests:
          - not_null
          - accepted_values:
              values: ['dufour', 'jura']
      - name: date
        description: Day of the rolling window's right edge.
        data_type: Date
        tests: [not_null]
      - name: active_users_30d
        description: >
          HOPR-comparable rolling-30d actives (31 days inclusive): clients that
          redeemed a ticket OR first key-bound. Quote this against HOPR's MAU.
        data_type: UInt64
      - name: active_users_7d
        description: HOPR-comparable rolling-7d actives. Quote against HOPR's WAU.
        data_type: UInt64
      - name: active_users_1d
        description: Clients active on this day alone, same definition.
        data_type: UInt64
      - name: using_users_30d
        description: >
          Stricter rolling-30d actives -- ticket redemptions only, excluding
          install-only clients. Use for "is the product being used".
        data_type: UInt64
      - name: using_users_7d
        description: Stricter rolling-7d actives, redemptions only.
        data_type: UInt64
      - name: using_users_1d
        description: Clients that redeemed on this day alone.
        data_type: UInt64
      - name: new_clients
        description: Clients whose first key-binding fell on this day.
        data_type: UInt64
      - name: tickets_redeemed
        description: Tickets redeemed by clients on this day.
        data_type: UInt64
      - name: redeemed_wxhopr
        description: wxHOPR paid by clients on this day, from channel balance decreases.
        data_type: Decimal(38, 18)
      - name: channels_active
        description: Distinct channels clients transacted on this day.
        data_type: UInt64

  # ─────────────────────────── served endpoints (api_*) ───────────────────────────
  # Contract surface for metrics-dashboard and the Cerebro API/MCP. Everything below
  # carries production + api: + granularity: + tier and a fully typed column schema,
  # which is what check_api_tags.py enforces. Renaming any of these means grepping the
  # metrics-dashboard SQL by FROM/JOIN, not by filename.
  #
  # The two GnosisVPN endpoints are tier3, not tier1: the product is in closed beta
  # until Shangri-La (Sept 2026), so their series are early-access telemetry. They
  # were unserved until 2026-08; the exit endpoint's grain column was renamed
  # activity_date -> date on promotion, which is what the daily convention requires.

  - name: api_hopr_gnosisvpn_users_daily
    description: >
      Served GnosisVPN client activity per network per day -- the demand side.
      Exposes BOTH user definitions: active_users_* (HOPR-comparable; redemption
      OR first key-binding) and using_users_* (redemptions only). They are not
      interchangeable and the difference between them is the
      deployed-but-never-used cohort, so a chart captioned "GnosisVPN users" must
      say which one it plots. The 30d window is 31 days inclusive and the 7d
      window is 7, an asymmetry inherited from HOPR's own query for
      comparability. No bandwidth column exists: tickets are probabilistic
      payments, not bytes. Passthrough of fct_hopr_gnosisvpn_users_daily.
    meta:
      owner: analytics_team
      authoritative: false
    columns:
      - name: date
        description: Day of the rolling window's right edge.
        data_type: Date
        tests: [not_null]
      - name: network
        description: HOPR network. rotsee (testnet) is excluded upstream.
        data_type: LowCardinality(String)
        tests: [not_null]
      - name: active_users_30d
        description: >
          HOPR-comparable rolling-30d active clients (31 days inclusive): redeemed
          a ticket OR first key-bound. This is the figure to compare with HOPR's
          published MAU.
        data_type: UInt64
      - name: active_users_7d
        description: HOPR-comparable rolling-7d active clients. Compare with HOPR's WAU.
        data_type: UInt64
      - name: active_users_1d
        description: Clients active on this day alone, same definition.
        data_type: UInt64
      - name: using_users_30d
        description: >
          Rolling-30d clients that actually redeemed a ticket, excluding
          install-only clients. The "is it being used" series.
        data_type: UInt64
      - name: using_users_7d
        description: Rolling-7d clients that actually redeemed a ticket.
        data_type: UInt64
      - name: using_users_1d
        description: Clients that redeemed on this day alone.
        data_type: UInt64
      - name: new_clients
        description: Clients whose first key-binding fell on this day.
        data_type: UInt64
      - name: tickets_redeemed
        description: Tickets redeemed by clients on this day.
        data_type: UInt64
      - name: redeemed_wxhopr
        description: wxHOPR paid by clients on this day.
        data_type: Decimal(38, 18)
      - name: channels_active
        description: Distinct channels clients transacted on this day.
        data_type: UInt64

  - name: api_hopr_network_health_daily
    description: >
      Daily nodes-ever-registered versus nodes-actually-online per network. The two are
      not interchangeable: registration is cumulative and never expires, so the registry
      figure runs several times the live network and the gap has widened every year.
      Never label either "network size" without saying which. Read nodes_online_avg with
      hours_observed -- the upstream hourly history has real gaps. NULL prober columns
      mean unmeasured, never zero; prober coverage is dufour-only.
    meta:
      owner: analytics_team
      authoritative: false
    columns:
      - name: network
        description: HOPR network; dufour, or jura for registration counts only.
        data_type: String
        tests: [not_null]
      - name: date
        description: Calendar day, UTC.
        data_type: Date
        tests: [not_null]
      - name: nodes_registered_new
        description: Nodes whose first on-chain KeyBinding fell on this date.
        data_type: UInt64
      - name: nodes_registered_cumulative
        description: >
          Running total of nodes ever registered. Never decrements -- abandonment is
          invisible to it. NOT the live network size.
        data_type: UInt64
      - name: nodes_online_avg
        description: >
          Mean of the dashboard's hourly online count across observed hours. The live
          network size. NULL where no hours were recorded.
        data_type: Nullable(Float64)
      - name: nodes_online_min
        description: Lowest hourly online count that day.
        data_type: Nullable(UInt32)
      - name: nodes_online_max
        description: Highest hourly online count that day.
        data_type: Nullable(UInt32)
      - name: hours_observed
        description: >
          Distinct hours actually recorded, 0-24. Load-bearing: a day can rest on one
          observation or twenty-four, so thin days are not comparable to full ones.
        data_type: UInt64
      - name: nodes_probed
        description: Nodes the prober attempted. NULL before the ingestor started, and for jura.
        data_type: Nullable(UInt64)
      - name: nodes_reachable
        description: Nodes the prober actually reached.
        data_type: Nullable(UInt64)
      - name: nodes_high_availability
        description: Nodes up at least 90% of the last 24 hours.
        data_type: Nullable(UInt64)
      - name: avg_latency_ms
        description: Mean round-trip time across reachable nodes, milliseconds.
        data_type: Nullable(Float64)
      - name: p50_latency_ms
        description: >
          Median round-trip time. Materially below the mean -- a tail of slow nodes pulls
          the average up, so prefer this as the headline.
        data_type: Nullable(Float64)
      - name: avg_availability_24h
        description: Mean 24-hour availability across probed nodes, in [0,1].
        data_type: Nullable(Float64)

  - name: api_hopr_channel_activity_daily
    description: >
      Daily payment-channel activity per network, SPLIT BY is_cover_traffic. The split is
      the contract: on dufour nearly every event is HOPR paying its own node runners in
      proportion to stake, so a total across the split presents a rewards schedule as user
      demand. Consumers must split or filter. tickets_redeemed is the trustworthy volume
      measure; channels_opened is not comparable across years.
    meta:
      owner: analytics_team
      authoritative: false
    columns:
      - name: network
        description: HOPR network. rotsee is excluded, so dufour or jura.
        data_type: String
        tests:
          - not_null
          - accepted_values:
              values: ['dufour', 'jura']
      - name: date
        description: >
          Calendar day, UTC. Named `date` rather than `activity_date` so the daily
          endpoint exposes its grain under the required name, and so it joins
          api_hopr_network_health_daily on (network, date) with no rename.
        data_type: Date
        tests: [not_null]
      - name: is_cover_traffic
        description: >
          1 where the channel source is a known HOPR cover-traffic node. A DIMENSION,
          never a measure -- always split or filter on it.
        data_type: UInt8
        tests: [not_null]
      - name: channels_opened
        description: Channels opened.
        data_type: UInt64
      - name: channels_closed
        description: Channels closed.
        data_type: UInt64
      - name: closures_initiated
        description: Outgoing closures initiated but not yet final.
        data_type: UInt64
      - name: tickets_redeemed
        description: Ticket redemptions. The trustworthy, time-stable volume metric.
        data_type: UInt64
      - name: fundings
        description: Channel balance increases.
        data_type: UInt64
      - name: redeemed_wxhopr
        description: wxHOPR paid to relayers, reconstructed from channel balance diffs.
        data_type: Decimal(38, 18)
      - name: funded_wxhopr
        description: wxHOPR pushed into channels.
        data_type: Decimal(38, 18)
      - name: active_channels
        description: Distinct channels seen that day. A per-day distinct count, so max not sum.
        data_type: UInt64
      - name: unique_source_nodes
        description: Distinct paying nodes.
        data_type: UInt64
      - name: unique_destination_nodes
        description: Distinct relaying nodes.
        data_type: UInt64
      - name: events
        description: Total decoded channel events.
        data_type: UInt64

  - name: api_hopr_nodes_by_country_latest
    description: >
      Current node counts per network per country. Nodes with no resolvable IPv4 or no
      ipinfo row appear as country_code 'UNKNOWN' with geo_resolved = 0 -- they are a row,
      never a filter, because dropping them shrinks the denominator of every share a chart
      computes. live_nodes counts only prober-reached nodes and is 0 for jura because
      nothing measures it, not because jura is down.
    meta:
      owner: analytics_team
      authoritative: false
    columns:
      - name: network
        description: HOPR network. rotsee is excluded, so dufour or jura.
        data_type: String
        tests:
          - not_null
          - accepted_values:
              values: ['dufour', 'jura']
      - name: as_of_date
        description: >
          When this snapshot is current, anchored to the newest on-chain evidence it
          contains rather than to today() -- so a stale build cannot read as live. Point-in-
          time endpoints must publish this; see the stale-snapshot-caveat lesson.
        data_type: Date
      - name: country_code
        description: ISO country code from ipinfo, or 'UNKNOWN' for unresolved nodes.
        data_type: String
        tests: [not_null]
      - name: geo_resolved
        description: 1 where the country came from ipinfo, 0 for the UNKNOWN bucket.
        data_type: UInt8
      - name: nodes
        description: Nodes ever registered with this country.
        data_type: UInt64
      - name: live_nodes
        description: >
          Of those, nodes the prober reached. dufour only -- 0 for jura means unmeasured.
        data_type: UInt64
      - name: cover_traffic_nodes
        description: Declared HOPR cover-traffic nodes here.
        data_type: UInt64
      - name: gnosisvpn_exit_nodes
        description: Declared GnosisVPN exit nodes here.
        data_type: UInt64
      - name: distinct_operators
        description: Distinct staking Safes -- the non-vanity decentralisation count.
        data_type: UInt64
      - name: distinct_hosts
        description: Distinct announced IPs. Below nodes wherever nodes share a machine.
        data_type: UInt64

  - name: api_hopr_nodes_hosting_latest
    description: >
      Current node counts per network per hosting provider, with the host-concentration
      figures. 'Unknown' means the org string matched no rule in the shared ipinfo
      classifier -- it is NOT residential and must not be folded into either side of a
      home-vs-datacenter split. 'NO_IPV4' and 'UNRESOLVED' are published for the same
      reason. nodes / distinct_hosts is the honest concentration read.
    meta:
      owner: analytics_team
      authoritative: false
    columns:
      - name: network
        description: HOPR network. rotsee is excluded, so dufour or jura.
        data_type: String
        tests:
          - not_null
          - accepted_values:
              values: ['dufour', 'jura']
      - name: as_of_date
        description: >
          When this snapshot is current, anchored to the newest on-chain evidence it
          contains rather than to today() -- so a stale build cannot read as live. Point-in-
          time endpoints must publish this; see the stale-snapshot-caveat lesson.
        data_type: Date
      - name: hosting_provider
        description: >
          Provider bucket from stg_crawlers_data__ipinfo, plus 'NO_IPV4' (never announced
          an IPv4) and 'UNRESOLVED' (has one, ipinfo has no row). 'Unknown' is a real
          classifier outcome, not a gap.
        data_type: String
        tests: [not_null]
      - name: nodes
        description: Nodes ever registered on this provider.
        data_type: UInt64
      - name: live_nodes
        description: Of those, nodes the prober reached. dufour only.
        data_type: UInt64
      - name: distinct_hosts
        description: Distinct announced IPs on this provider.
        data_type: UInt64
      - name: distinct_operators
        description: Distinct staking Safes on this provider.
        data_type: UInt64
      - name: cover_traffic_nodes
        description: Declared HOPR cover-traffic nodes on this provider.
        data_type: UInt64
      - name: gnosisvpn_exit_nodes
        description: Declared GnosisVPN exit nodes on this provider.
        data_type: UInt64

  - name: api_hopr_node_locations_latest
    description: >
      Current nodes aggregated to a plottable point: one row per (network, country, city)
      with coordinates. DELIBERATELY INCOMPLETE -- nodes without coordinates cannot be
      plotted and are excluded here, so a map built on this alone under-counts the network.
      Publish the 'UNKNOWN' residual from api_hopr_nodes_by_country_latest alongside any
      map. Coordinates are ipinfo city centroids, not machine locations: every node in a
      city collapses to one point, which is the honest resolution for IP geolocation.
    meta:
      owner: analytics_team
      authoritative: false
    columns:
      - name: network
        description: HOPR network. rotsee is excluded, so dufour or jura.
        data_type: String
        tests:
          - not_null
          - accepted_values:
              values: ['dufour', 'jura']
      - name: as_of_date
        description: >
          When this snapshot is current, anchored to the newest on-chain evidence it
          contains rather than to today() -- so a stale build cannot read as live. Point-in-
          time endpoints must publish this; see the stale-snapshot-caveat lesson.
        data_type: Date
      - name: country_code
        description: ISO country code from ipinfo.
        data_type: String
      - name: city
        description: City name from ipinfo, or 'UNKNOWN_CITY' where only a country resolved.
        data_type: String
      - name: latitude
        description: City centroid latitude. Not the machine's position.
        data_type: Nullable(Float64)
      - name: longitude
        description: City centroid longitude. Not the machine's position.
        data_type: Nullable(Float64)
      - name: nodes
        description: Nodes at this point.
        data_type: UInt64
      - name: live_nodes
        description: Of those, nodes the prober reached. dufour only.
        data_type: UInt64
      - name: distinct_hosts
        description: Distinct announced IPs at this point.
        data_type: UInt64
      - name: distinct_operators
        description: Distinct staking Safes at this point.
        data_type: UInt64
      - name: cover_traffic_nodes
        description: Declared HOPR cover-traffic nodes at this point.
        data_type: UInt64
      - name: gnosisvpn_exit_nodes
        description: Declared GnosisVPN exit nodes at this point.
        data_type: UInt64
      - name: top_hosting_provider
        description: Most common provider at this point, for a map tooltip.
        data_type: Nullable(String)

  - name: api_hopr_protocol_params_daily
    description: >
      Daily protocol parameters and staked/locked wxHOPR from blokli, HOPR's own v4
      indexer. JURA ONLY -- blokli has no dufour endpoint, and rotsee is filtered out as a
      testnet. payout_per_winning_ticket_wxhopr is the figure worth showing: HOPR pays
      probabilistically, so ticket price alone means nothing and is not comparable across
      networks running different winning probabilities. FORWARD-ONLY -- history starts when
      the click-runner ingestor first ran and earlier days cannot be recovered.
    meta:
      owner: analytics_team
      authoritative: false
    columns:
      - name: network
        description: HOPR network; jura in practice (rotsee excluded as testnet).
        data_type: String
        tests: [not_null]
      - name: date
        description: Snapshot date.
        data_type: Date
        tests: [not_null]
      - name: ticket_price_wxhopr
        description: Price of a single ticket. Near-meaningless without the win probability.
        data_type: Nullable(Float64)
      - name: min_ticket_winning_probability
        description: Minimum probability with which a ticket wins, in [0,1].
        data_type: Float64
      - name: payout_per_winning_ticket_wxhopr
        description: >
          ticket_price / min_win_probability -- what a winning ticket is actually worth,
          and the only cross-network-comparable economic figure here.
        data_type: Nullable(Float64)
      - name: key_binding_fee_wxhopr
        description: Fee to bind a packet key to a chain key.
        data_type: Nullable(Float64)
      - name: channel_closure_grace_period_s
        description: Seconds a channel stays pending-to-close before it can be finalised.
        data_type: UInt32
      - name: account_count
        description: Accounts (nodes) blokli knows on this network.
        data_type: UInt32
      - name: safes_count
        description: Distinct staking Safes.
        data_type: UInt32
      - name: safes_balance_wxhopr
        description: wxHOPR held in Safes -- staked but not yet in channels.
        data_type: Nullable(Float64)
      - name: channels_total
        description: Channels in any state.
        data_type: UInt32
      - name: channels_open
        description: Channels currently open.
        data_type: UInt32
      - name: channels_open_balance_wxhopr
        description: wxHOPR locked in open channels -- the network's working capital.
        data_type: Nullable(Float64)
      - name: channels_pendingtoclose
        description: Channels closing but still inside the grace period.
        data_type: UInt32
      - name: channels_pendingtoclose_balance_wxhopr
        description: wxHOPR still locked in pending-to-close channels.
        data_type: Nullable(Float64)
      - name: total_wxhopr_committed
        description: >
          safes_balance + channels_open_balance. The closest thing to a TVL for HOPR, and
          it needs no balance indexing.
        data_type: Nullable(Float64)
