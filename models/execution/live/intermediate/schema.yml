version: 2

models:

- name: int_live__dex_trades_raw
  description: >
    Cached, rolling 48h window of unified DEX swaps across all supported
    protocols (Uniswap V3, Swapr V3, Balancer V2, Balancer V3) on Gnosis Chain.
    Normalizes amounts by token decimals, resolves symbols, and attaches USD
    prices per side via ASOF join against daily token prices. The final
    `amount_usd` uses the LEAST of the two priced sides when both are known
    (a conservative notional that rejects inflated long-tail prices), or the
    single available price when only one side is priced.

    MATERIALIZATION: incremental ReplacingMergeTree, refreshed by a k8s
    CronJob running `dbt run --select +tag:live` every ~5 min. First run
    backfills the last 48h (source TTL). Each subsequent run delete+inserts
    the last `live_trades_overlap_minutes` (default 120 = 2h) to self-heal
    against cryo-live's out-of-order / bulk-attach inserts. 48h TTL on
    `block_timestamp` prevents unbounded growth and matches the source.
    Downstream api views read this table directly, so dashboard queries
    never trigger decode-log scans over `execution_live.logs`.
  columns:
  - name: block_number
    tests: [not_null]
  - name: block_timestamp
    tests: [not_null]
  - name: transaction_hash
    tests: [not_null]
  - name: log_index
    tests: [not_null]
  - name: protocol
    tests: [not_null]
  - name: pool_address
  - name: token_bought_address
  - name: token_bought_symbol
    description: Symbol resolved from `stg_pools__tokens_meta`. Empty string if the token is unknown.
  - name: amount_bought_raw
  - name: amount_bought
    description: Decimal-normalized bought amount.
  - name: token_bought_price_usd
    description: USD price for the bought token (ASOF join on daily prices, last 7 days).
  - name: amount_bought_usd
  - name: token_sold_address
  - name: token_sold_symbol
  - name: amount_sold_raw
  - name: amount_sold
  - name: token_sold_price_usd
  - name: amount_sold_usd
  - name: amount_usd
    description: >
      Conservative USD notional. When both sides priced: least(bought_usd, sold_usd).
      When only one side priced: that side's USD. When neither priced: NULL.
  tests: []

- name: int_live__gpay_activity_raw
  description: >
    Cached, rolling 48h window of Gnosis Pay Payments and Fiat Top Ups decoded
    from `execution_live.logs` Transfer events. Classification mirrors
    `int_execution_gpay_activity` (Payment = Safe → merchant; Fiat Top Up =
    zero-address mint → Safe for EURe/GBPe). Wallet membership comes from the
    production batch table `dbt.int_execution_gpay_wallets` via
    `source('dbt_live_refs')` (daily refresh; works from playground_max).
    USD via ASOF join to production daily token prices (latest on/before
    event date) so same-day live rows are still priced.

    MATERIALIZATION: incremental ReplacingMergeTree, refreshed by the live
    loop (`dbt run --select tag:live` every ~45s). First run backfills the
    last 48h (source TTL). Subsequent runs re-append the last
    `live_gpay_overlap_minutes` (default 15) to self-heal out-of-order
    cryo-live inserts. 48h TTL on `block_timestamp`. Source scan is pre-filtered
    to merchant-bound Transfers and zero-address mints before the wallet join.
  columns:
  - name: block_number
    tests: [not_null]
  - name: block_timestamp
    tests: [not_null]
  - name: transaction_hash
    tests: [not_null]
  - name: log_index
    tests: [not_null]
  - name: wallet_address
    description: GP Safe that paid (Payment) or received the mint (Fiat Top Up).
    tests: [not_null]
  - name: action
    description: "'Payment' or 'Fiat Top Up'."
    tests: [not_null]
  - name: symbol
  - name: token_address
  - name: sender
  - name: receiver
  - name: value_raw
  - name: amount
    description: Decimal-normalized token amount.
  - name: amount_usd
    description: USD notional from daily prices; NULL when price missing or zero.
  tests: []
  meta:
    owner: analytics_team
    authoritative: false
    agent:
      grain: [block_timestamp, transaction_hash, log_index]
      semantics: event_stream
      invariants:
      - id: rolling-48h-window-only
        text: This is a 48h cache, not a history. The 48h TTL on block_timestamp matches
          the execution_live.logs source retention, so any total computed here is a
          window total — never compare it against the batch pipeline's lifetime figures.
          Historical GP activity lives in int_execution_gpay_activity.
      - id: overlap-append-needs-final
        text: Every live-loop run re-appends the last live_gpay_overlap_minutes to
          self-heal out-of-order cryo-live inserts, so the table legitimately holds
          duplicate grain rows between merges. Readers MUST use FINAL (as
          api_execution_live_gpay_activity and _minute_2h do); a new reader that omits
          it will double-count the overlap window.
      - id: wallet-set-lags-by-design
        text: Wallet membership is read from the daily-refreshed batch table
          dbt.int_execution_gpay_wallets via source('dbt_live_refs'), so a Safe created
          today can be absent until the next batch run. Missing brand-new Safes is
          expected lag, not a decode bug.
      hazards: [append-over-populated-duplicates, stale-snapshot-caveat]
      validation:
      - 'window bound: max(block_timestamp) - min(block_timestamp) <= 48 hours'
      - 'reader parity: SELECT count() FROM model FINAL equals uniqExact((block_timestamp, transaction_hash, log_index))'
      reprocess_runbook: >-
        Nothing to backfill — the 48h TTL means a full rebuild is just the next live-loop
        run. If the table is wrong, `dbt run --full-refresh -s int_live__gpay_activity_raw`
        re-reads the whole 48h source window; the live loop
        (`dbt run --select tag:live`) then resumes appending overlap windows.
