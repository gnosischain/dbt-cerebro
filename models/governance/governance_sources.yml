version: 2

sources:
  # Off-chain governance + community data ingested by click-runner
  # (ingestors/snapshot_ingestor.py + ingestors/forum_ingestor.py) into
  # ReplacingMergeTree(ingested_at) tables. Staging dedupes via FINAL.
  #
  # Dedicated source block so the schema can be redirected during dev/backfill
  # validation without touching other databases. Mirrors the crawlers_data_cow
  # pattern.
  #
  #   DEV : point DBT_GOVERNANCE_SCHEMA at a playground schema to validate
  #         against a redirected copy; leave unset to read prod governance_db
  #   PROD: leave unset -> governance_db
  #
  # The default was `crawlers_data` until 2026-07-28. That was stale and wrong:
  # crawlers_data contains ZERO governance tables (verified), so any run without
  # the env var died with UNKNOWN_TABLE on all nine staging models. click-runner's
  # own ingestors default to GOVERNANCE_DATABASE=governance_db, which is where the
  # data actually lands, so that is the correct prod default. Safe to change --
  # no governance model is deployed to the prod `dbt` database, so nothing
  # scheduled depends on the old value.
  #
  # Forgetting the env var in dev now fails with a permissions error on
  # governance_db rather than a missing-table error. Both are loud; neither
  # silently reads the wrong data.
  - name: governance
    schema: "{{ env_var('DBT_GOVERNANCE_SCHEMA', 'governance_db') }}"
    freshness:
      warn_after: {count: 36, period: hour}
      error_after: {count: 72, period: hour}
    meta:
      owner: analytics_team
      authoritative: false
    tables:
      - name: snapshot_space
        description: >
          One row per ingest of the GnosisDAO Snapshot space (gnosis.eth):
          proposal/vote/follower counts plus the space-level voting-power
          strategy set (in raw_json.strategies).
        loaded_at_field: ingested_at
      - name: snapshot_proposals
        description: >
          One row per Snapshot proposal. Typed key columns + full API object in
          raw_json (choices, scores, plugins). GIP number is parseable from the
          title. ReplacingMergeTree(ingested_at) keyed by id.
        loaded_at_field: ingested_at
      - name: snapshot_votes
        description: >
          Raw votes as returned by the Snapshot API, one row per (proposal, vote
          id). A voter re-voting on an open proposal can produce a new vote id,
          so raw may hold >1 row per voter — stg_governance__snapshot_votes
          dedupes to the latest vote per (proposal_id, voter).
        loaded_at_field: ingested_at
      - name: snapshot_follows
        description: >
          One row per follower observed. Cannot capture unfollows (stale rows
          linger); use snapshot_space.followers_count for the authoritative
          current total.
        loaded_at_field: ingested_at
      - name: forum_categories
        description: Discourse category tree for forum.gnosis.io.
        loaded_at_field: ingested_at
      - name: forum_topics
        description: >
          One row per Discourse topic (discussion thread). GIP number parseable
          from the title; governance phase (phase-1/2/3) from the tags string.
        loaded_at_field: ingested_at
      - name: forum_posts
        description: >
          One row per Discourse post — every comment/reply. `cooked` is the
          rendered HTML body; a Snapshot proposal id is often linkable from it.
        loaded_at_field: ingested_at
      - name: forum_users
        description: Public Discourse user directory (activity + like counts).
        loaded_at_field: ingested_at
      - name: forum_likes
        description: >
          Per-like edges from /user_actions.json (filter=1): one row per (post,
          liker) with the like's OWN created_at. This is what makes like timing
          answerable at all -- forum_posts.like_count is a scalar frozen at the
          topic's last bump, with no timestamp and no actor. Unlikes are not
          representable (the row simply stops being re-observed).
          acting_username is the crawled username, authoritative for "who liked
          this"; resolve the post's AUTHOR by joining forum_posts on post_id.
          Coverage is partial by nature: /user_actions.json 404s for 673 of 1169
          users whose /u/{username}.json is a healthy 200, so roughly 74% of the
          directory's likes_given total is captured. The ingestor logs its capture
          rate every run rather than leaving the gap silent.
        loaded_at_field: ingested_at
      - name: forum_polls
        description: >
          Discourse poll options, one row per (post, poll, option) with its vote
          count. 189 polls across 180 topics back to 2020-11-02, 152 in GIP
          topics, and 75 carrying an "In Favour"/"Against" temperature check --
          the only place in the corpus where one-person-one-vote community
          sentiment is recorded on a question that later gets a token-weighted
          Snapshot vote.
          Three traps, all load-bearing: option_votes = -1 means WITHHELD (results
          policy hides counts) and 0 is a real zero; close_at is a SCHEDULE never
          reconciled with reality (72 of 106 open polls have a lapsed close_at, 34
          have none, none are future -- so "close_at < now()" reports every poll
          closed), `status` is the only open/closed signal; option_id is an md5 of
          the option TEXT so it recurs across unrelated topics and identifies an
          option only WITHIN a poll.
          The poll row carries no created_at -- date a poll by its host post.
        loaded_at_field: ingested_at

  # DelegateRegistry events come from rpc-log-indexer, not click-runner.
  # click-runner's Dune CSV ingestor was removed 2026-07-24 (201dd2e); the
  # live source is rpc_log_indexer.v_delegate_events_gnosis (both chain 1 and
  # chain 100 — Snapshot's gnosis.eth strategies read both registries).
  - name: rpc_log_indexer
    schema: rpc_log_indexer
    meta:
      owner: analytics_team
      authoritative: true
    tables:
      - name: v_delegate_events_gnosis
        description: >
          Snapshot DelegateRegistry SetDelegate/ClearDelegate events for the
          gnosis.eth space id, projected from rpc_log_indexer.decoded_events_canonical.
          One row per on-chain event; includes chain_id 1 (Ethereum) and 100
          (Gnosis Chain). Resolve current state via
          int_governance_current_delegations, not this view directly.
