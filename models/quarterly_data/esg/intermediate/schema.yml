version: 2
models:

- name: int_quarterly_esg_carbon_intensity_with_fallback
  description: >
    Monthly carbon intensity per country for the quarterly ESG reports: the months Ember
    has published, read from int_esg_carbon_intensity_ensemble. Until 2026-11 it
    forward-filled each country's last known month for up to 11 months (flagged
    is_estimated); the ESG chain now waits for Ember's publication instead, so the flag
    was dropped. The name stays because the semantic layer reads this view.
  columns:
  - name: month_date
    description: Month start date for the carbon intensity measurement or estimate.
    data_type: Date
    tests:
    - not_null
  - name: country_code
    description: ISO 3-letter country code or 'WORLD' for global average.
    data_type: String
    tests:
    - not_null
  - name: carbon_intensity_mean
    description: Ember's monthly grid carbon intensity in gCO2e/kWh, as published.
    data_type: Float64
  - name: carbon_intensity_std
    description: Standard deviation of carbon intensity estimate.
    data_type: Float64
  tests:
  - dbt_utils.unique_combination_of_columns:
      combination_of_columns:
      - country_code
      - month_date

- name: int_quarterly_esg_carbon_footprint_with_fallback
  description: >
    Daily annualised CO2 and energy for the quarterly ESG reports, read from
    fct_esg_carbon_footprint_uncertainty, which ends on the last day of the latest month
    for which Ember has published the World carbon intensity. Until 2026-11 it extended the
    fact table with estimates built from forward-filled carbon intensity (flagged
    is_estimated); it now waits for Ember's publication, so the flag was dropped.
  columns:
  - name: date
    description: Observation date for the carbon footprint data point.
    data_type: Date
    tests:
    - not_null
    - unique:
        config:
          severity: warn
  - name: annual_co2_tonnes_projected
    description: Annualised CO2 emissions in tonnes, projected from the daily value (daily × 365 / 1000).
    data_type: Float64
  - name: annual_energy_Mwh_projected
    description: Annualised energy consumption in MWh, projected from the daily value (daily × 365 / 1000).
    data_type: Float64
