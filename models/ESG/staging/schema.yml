version: 2
models:

- name: stg_crawlers_data__country_codes
  description: The stg_crawlers_data__country_codes model consolidates standardized country identifiers and regional classifications to support geographic analysis within the crawlers data pipeline.
  columns:

  - name: name
    description: The official country name.
    data_type: String

  - name: alpha-2
    description: The two-letter ISO 3166-1 alpha-2 country code.
    data_type: String

  - name: alpha-3
    description: The three-letter ISO 3166-1 alpha-3 country code.
    data_type: String

  - name: country-code
    description: The numeric ISO 3166-1 country code.
    data_type: String

  - name: iso_3166-2
    description: The ISO 3166-2 code representing the primary subdivision of the country.
    data_type: String

  - name: region
    description: The broad geographic region classification.
    data_type: String

  - name: sub-region
    description: The more specific geographic sub-region classification.
    data_type: String

  - name: intermediate-region
    description: An intermediate geographic classification between region and sub-region.
    data_type: String

  - name: region-code
    description: The code associated with the region classification.
    data_type: String

  - name: sub-region-code
    description: The code associated with the sub-region classification.
    data_type: String

  - name: intermediate-region-code
    description: The code associated with the intermediate-region classification.
    data_type: String
  meta:
    owner: analytics_team
    authoritative: false
- name: stg_crawlers_data__ember_generation_monthly
  description: >-
    Ember monthly electricity data ("generation" release): one row per area x month x
    electricity source, metrics as columns, read with FINAL from the full-reload raw
    table. iso3_code is empty for Ember's aggregate regions (World, EU, G20, ...).
    The ESG chain reads electricity_source 'Total generation' and its
    emissions_intensity_gco2e_kwh.
  columns:

  - name: area
    description: Country, economy or aggregate region name as published by Ember (e.g. 'Germany', 'World').
    data_type: String
    tests:
    - not_null

  - name: iso3_code
    description: ISO 3166-1 alpha-3 code; empty for aggregate regions.
    data_type: String

  - name: month_date
    description: First day of the month the values describe.
    data_type: Date
    tests:
    - not_null

  - name: area_type
    description: "'Country or economy' or 'Region'."
    data_type: LowCardinality(String)

  - name: electricity_source
    description: Generation source ('Total generation', 'Coal', 'Solar', ..., 'Demand', 'Net imports').
    data_type: LowCardinality(String)
    tests:
    - not_null

  - name: is_aggregated_source
    description: True when electricity_source aggregates other sources (e.g. 'Fossil', 'Total generation').
    data_type: Bool

  - name: generation_twh
    description: Generation in TWh.
    data_type: Nullable(Float64)

  - name: generation_yoy_change_twh
    description: Year-on-year change in generation, TWh.
    data_type: Nullable(Float64)

  - name: generation_yoy_change_pct
    description: Year-on-year change in generation, percent.
    data_type: Nullable(Float64)

  - name: share_of_generation_pct
    description: Share of the area's generation, percent.
    data_type: Nullable(Float64)

  - name: share_of_generation_yoy_change_pp
    description: Year-on-year change in the share of generation, percentage points.
    data_type: Nullable(Float64)

  - name: emissions_mtco2e
    description: Power-sector emissions, MtCO2e.
    data_type: Nullable(Float64)

  - name: emissions_yoy_change_mtco2e
    description: Year-on-year change in emissions, MtCO2e.
    data_type: Nullable(Float64)

  - name: emissions_yoy_change_pct
    description: Year-on-year change in emissions, percent.
    data_type: Nullable(Float64)

  - name: share_of_emissions_pct
    description: Share of the area's power-sector emissions, percent.
    data_type: Nullable(Float64)

  - name: emissions_intensity_gco2e_kwh
    description: Emissions intensity in gCO2e per kWh. On 'Total generation' this is the grid carbon intensity of the area for the month.
    data_type: Nullable(Float64)

  - name: continent
    description: Continent; empty for aggregate regions.
    data_type: LowCardinality(String)

  - name: ember_region
    description: Ember's regional grouping; empty for aggregate regions.
    data_type: LowCardinality(String)

  - name: is_eu_member
    description: EU member.
    data_type: Bool

  - name: is_oecd_member
    description: OECD member.
    data_type: Bool

  - name: is_g20_member
    description: G20 member.
    data_type: Bool

  - name: is_g7_member
    description: G7 member.
    data_type: Bool

  - name: is_asean_member
    description: ASEAN member.
    data_type: Bool

  - name: ingested_at
    description: Load time of the row's newest copy; one value per load.
    data_type: DateTime
  meta:
    owner: analytics_team
    authoritative: false
  tests:
  - dbt_utils.unique_combination_of_columns:
      combination_of_columns:
      - area
      - month_date
      - electricity_source
