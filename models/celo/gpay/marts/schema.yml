version: 2

# ────────────────────────────────────────────────────────────────────────────
# Celo Gnosis Pay marts.
#
# SCOPE (applies to every model below): Celo Gnosis Pay is the "GP 2.0" product
# that launched with MiniPay on Celo. All volume, balance and flow figures are
# gated on the celo_tokens_whitelist seed, which carries FOUR tokens — USDT,
# USDC, USDm and XAUt0. Every "USDC/USDT" note below is therefore a statement
# about the DATA, not the code: as of 2026-08-03 only USDT and USDC have ever
# moved on a card Safe (USDT 6032 transfers / 713 Safes, USDC 1941 / 181), while
# USDm and XAUt0 have zero rows. If either starts moving these marts pick it up
# automatically with no code change — but nothing about them is exercised today,
# so treat any USDm/XAUt0 figure as untested until it appears.
# Two NON-whitelisted tokens do reach card Safes (0xc750468f… 14 transfers,
# 0xd896efcf… 5) and are excluded by the address-gated whitelist join; they are
# visible only in the all-token models. Introducing a real fifth token means
# adding it to celo_tokens_whitelist (the seed is now the only gate — the old
# click-runner / Dune ingestion whitelist is retired).
#
# Balances are net-flow (cumulative inflows − outflows since a Safe's first
# activity), which equals the true on-chain balance here because Safes start
# empty pre-launch and there are no Safe-to-Safe transfers (verified 2026-08-03:
# zero transfers with a registry Safe on both sides) — so no inflow is
# double-counted and no value arrives outside the whitelisted set.
# The MiniPay Card's XAUt0/USDT/USDC cashback is NOT yet modeled in these marts
# (the on-chain rewards disburser is not yet identified; see the cashback_sources
# scaffold in int_celo_gpay_activity — it is compiled out, so Cashback is a
# zero-row action, not a measured one). Reversal is likewise scaffolded but has
# never fired: no bridge-to-card transfer has occurred.
# There is no GNO cashback program on Celo (unlike the Gnosis Chain GP dashboard).
# ────────────────────────────────────────────────────────────────────────────

models:

# ── Fact models ─────────────────────────────────────────────────────────────

- name: fct_celo_gpay_activity_daily
  description: |
    Daily card-payment activity (active Safes, payment count, USD volume) plus BOTH
    funnel counts, which are different metrics:
      * funded    — the card has ever RECEIVED money (any inbound action).
      * activated — the card has ever SPENT (settled a Payment to a settlement
                    contract). Equals int_celo_gpay_wallets.is_activated.
    Funnel on 2026-08-05: 1817 issued (int_celo_gpay_safe_registry) > 1087 funded >
    662 activated.

    RESTATED 2026-08-05. `cumulative_funded` previously counted from a card's first
    PAYMENT, so it tracked activation under the funded name and read 40% low (654 vs
    1075). The original series is preserved as newly_activated/cumulative_activated.

    The date spine is the UNION of payment-activity days and funnel-transition days,
    not payment days alone: 9 days saw a card funded with nobody spending, and a
    payment-only spine dropped the 28 cards funded on them from cumulative_funded
    silently. Rows contributed only by the union carry active_users / total_payments /
    total_volume_usd = 0, which is the truth for those days — so do NOT read a 0 row
    as missing data.

    User grain is safe_address (on Celo a card = a Safe = the user). Current partial
    day is excluded. Whitelisted tokens only (USDT/USDC in practice — see scope note).
  columns:
  - name: date
    description: Calendar date.
    data_type: Date
  - name: active_users
    description: >-
      Distinct Safes that made a payment on this date. 0 on a date present only
      because a card was funded that day (see the spine note above).
    data_type: UInt64
  - name: total_payments
    description: Number of payments settled on this date. 0 on a funding-only date.
    data_type: UInt64
  - name: total_volume_usd
    description: USD payment volume on this date (USDC + USDT). 0 on a funding-only date.
    data_type: Float64
  - name: newly_funded
    description: Safes that RECEIVED money for the first time on this date.
    data_type: UInt64
  - name: cumulative_funded
    description: >-
      Running total of ever-funded Safes through this date. Reaches 1075 on
      2026-08-05 (1087 all-time, less cards first funded today, which is excluded).
    data_type: UInt64
  - name: newly_activated
    description: Safes whose first-ever payment fell on this date.
    data_type: UInt64
  - name: cumulative_activated
    description: >-
      Running total of ever-spent Safes through this date; 654 on 2026-08-05. This is
      the series cumulative_funded carried before the restatement. Always <=
      cumulative_funded, since a card cannot spend before it is funded.
    data_type: UInt64
  meta:
    owner: analytics_team
    authoritative: false

