- name: fct_celo_gpay_card_balances_alltoken_daily
  description: |
    Deterministic ALL-TOKEN running balance per card Safe (net-flow-since-
    inception, same idiom as fct_celo_gpay_balances_safe_daily but across every token
    the Safe touches). NOTE: the marts-level whitelist scope comment above does
    NOT apply here — this model is intentionally all-token. balance_raw is the
    exact integer net flow (always set); balance is human units, set only for
    known-decimals tokens. No USD.

    SPARSE, unlike fct_celo_gpay_balances_safe_daily: a (safe, token) pair only
    has a row on days it had flow, so the latest row per pair carries forward
    implicitly. "Total balance held" therefore requires
    argMax(balance, date) per (safe_address, token_address) — a
    `WHERE date = (SELECT max(date) ...)` snapshot undercounts badly (measured
    2026-08-04: 11,574.22 on the latest day vs a true 25,676.93, a 55% undercount,
    because only 112 of 932 pairs had flow that day). Zero rows ARE written (501 of
    them), so the carry-forward total is trustworthy and the sibling trap in
    docs/lessons/sparse-zero-row-stale-survival.md does not bite here.

    DO NOT SUM `balance`. It is a running total, so summing across dates re-counts
    the same balance every day, and summing one date drops every card without flow.
    The semantic measure that did this was removed 2026-08-04; the model stays
    exposed for its DIMENSIONS (which tokens a card holds). For a total use
    api_celo_gpay_total_balance (single latest-day row); the correct per-safe base is
    the dense fct_celo_gpay_balances_safe_daily, whose latest day equals the
    carry-forward total here to the cent (25,676.93 on 2026-08-04).

    Do not read api_celo_gpay_total_balance (25,653.36) as disagreeing with that
    25,676.93 — they are different units, not a discrepancy. This model and `balance`
    are NATIVE token units; the api reports mark-to-market USD, which is lower simply
    because USDT and USDC trade a hair under a dollar (20,059.08 USDT at 0.9989 plus
    5,617.85 USDC at 0.99973, verified 2026-08-04). See the balance_usd column note on
    fct_celo_gpay_balances_safe_daily.
  columns:
  - name: date
    description: Day of the balance change. Sparse — present only on days this (safe, token) pair had flow.
    data_type: Date
  - name: safe_address
    description: GP card Safe address (0x-prefixed, lowercase).
    data_type: String
  - name: token_address
    description: Token contract address (0x-prefixed, lowercase). Any token, whitelisted or not.
    data_type: String
  - name: token_symbol
    description: Whitelist symbol; NULL for non-whitelisted tokens.
    data_type: Nullable(String)
  - name: balance_raw
    description: >-
      Cumulative exact integer net flow (in - out). Signed, because a balance
      legitimately falls. NULL only if a contributing transfer exceeded Int256 max
      (2^255-1) and so could not be represented — such a transfer is excluded from
      the running total rather than sign-flipped into a fake outflow, and the warn
      test celo_gpay_transfer_amount_fits_int256 on the upstream transfers model is
      what surfaces it. Never observed (max amount_raw is 3.0e9 against a 5.8e76
      bound); 0 NULL and 0 negative rows on 2026-08-05.
    data_type: Nullable(Int256)
  - name: balance
    description: Cumulative human-unit balance; NULL for unknown-decimals tokens.
    data_type: Nullable(Float64)
  meta:
    owner: analytics_team
    authoritative: false

- name: fct_celo_gpay_card_funding
  description: |
    Deterministic funding-relationship per card Safe: which addresses fund it
    (inbound transfers), per token, plus each funder's fan-out and a label-free
    funding_channel. RAW addresses, NO identity labels — we do not claim a funder
    "is" MiniPay, a ramp, or a CEX. Grain (safe_address, funder, token_address).
    All-token (the marts whitelist scope comment does not apply).

    funding_channel is a SHAPE classification from
    int_celo_gpay_funding_tx_envelopes (transaction envelope + call pattern +
    funder fan-out). CIP-64 (transaction_type 123) alone is not MiniPay — most of
    Celo uses that envelope. Channel values:

      cip64_direct_solo — every transfer in this relationship is CIP-64, the funder
        EOA called token.transfer() directly, and that funder funds exactly one
        card. This is the MiniPay-shaped path; do not rename the value to "minipay".
      other_direct — same direct EOA transfer() shape, but the envelope is not
        CIP-64 (type 0/2), and the funder funds exactly one card.
      hub — this funder funds two or more cards. Fan-out wins over envelope: a
        multi-card CIP-64 funder is still hub. Includes the legacy 0xa0dd… hub
        (type 0, ~250 cards).
      mediated — not a direct EOA→token transfer (e.g. Gnosis Safe execTransaction
        0x6a761202, routers). Assigned before hub when the call is not direct.
      mixed — transfers in this (safe, funder, token) relationship disagree on
        channel (rare).
      unknown — transfer row(s) could not be joined to celo_execution.transactions.
  columns:
  - name: safe_address
    description: The GP card Safe being funded (0x-prefixed, lowercase).
    data_type: String
  - name: funder
    description: RAW inbound sender address, deliberately unlabeled.
    data_type: String
  - name: token_address
    description: Funding token contract address (0x-prefixed, lowercase). Any token, whitelisted or not.
    data_type: String
  - name: token_symbol
    description: Whitelist symbol; NULL for non-whitelisted tokens (decimals unknown).
    data_type: Nullable(String)
  - name: n_transfers
    description: Inbound transfers from this funder to this card in this token.
    data_type: UInt64
  - name: first_funded_at
    description: Timestamp of this funder's first inbound transfer to this card in this token.
    data_type: DateTime
  - name: last_funded_at
    description: Timestamp of this funder's most recent inbound transfer to this card in this token.
    data_type: DateTime
  - name: total_amount_raw
    description: >-
      Exact integer sum of inbound amounts (this card/funder/token). UNSIGNED: these
      are uint256 ERC-20 amounts and inbound-only, so no sign is meaningful and a
      signed cast could only introduce a sign-flip above 2^255 (EXECUTIONTRANSFERS-C03).
    data_type: UInt256
  - name: total_amount
    description: Native total for known-decimals tokens; NULL otherwise.
    data_type: Nullable(Float64)
  - name: funder_n_cards_funded
    description: Distinct cards this funder funds (fan-out; the relayer-vs-individual signal).
    data_type: UInt64
  - name: funder_n_funding_transfers
    description: Total inbound funding transfers this funder makes across all cards.
    data_type: UInt64
  - name: funding_channel
    description: >-
      Shape classification for this (safe, funder, token) relationship. See model
      description for the channel glossary. Not an identity label.
    data_type: String
    tests:
    - not_null
    - accepted_values:
        values: ['cip64_direct_solo', 'other_direct', 'hub', 'mediated', 'mixed', 'unknown']
  meta:
    owner: analytics_team
    authoritative: false

- name: fct_celo_gpay_cardholder_engagement
  description: |
    One row per Celo GP card, joining the card's own lifecycle to whether the person
    behind it is still economically alive on Celo at all.

    THE QUESTION THIS ANSWERS: the card-side tree can tell you a card stopped being
    used, but not why - and the two possible whys need opposite responses. A holder who
    left the chain is lost; a holder still transacting daily in their own wallet has
    simply stopped choosing the card, and that one is winnable. Until this model
    existed both looked identical (a churned card). Measured 2026-08-10 the split was
    not close: of cards dormant 7-30 days, 74% of holders were still active in-wallet;
    dormant 30+, 65%; funded but never spent, 83%.

    CLIPPED TO ONE HORIZON, for the same reason fct_celo_gpay_card_funnel is. The card
    signal (int_celo_gpay_activity_daily) and the wallet signal
    (int_celo_gpay_funder_wallet_daily) are separate incremental models built at
    different times; whichever lags is the binding constraint. observed_through is the
    LEAST of the two, never today(). If the wallet model lags a day, every holder would
    otherwise read as newly silent and the table would swing toward "gone".

    MAPPING IS PARTIAL AND SAYS SO. Only solo funders can be attributed unambiguously.
    Hub- or router-funded cards get wallet_address = NULL and land in a
    '__wallet_unmapped' segment - a coverage limit, NOT evidence of absence. Never
    read unmapped as gone.
  columns:
  - name: safe_address
    description: GP card Safe address.
    data_type: String
    tests:
    - unique
    - not_null
  - name: wallet_address
    description: The solo funding wallet behind this card; NULL when the card was
      funded by a hub or a contract router.
    data_type: Nullable(String)
  - name: issued_at
    description: Card provisioning date.
    data_type: Date
  - name: first_funded_at
    description: First inbound action on the card; NULL if never funded.
    data_type: Nullable(Date)
  - name: last_payment_at
    description: Most recent Payment; NULL if the card never spent.
    data_type: Nullable(Date)
  - name: wallet_last_active_at
    description: Most recent non-fee transfer by the funding wallet; NULL when unmapped.
    data_type: Nullable(Date)
  - name: observed_through
    description: The as-of date, taken as the LEAST of the card and wallet models' max
      dates. Every state column is relative to this, not to today().
    data_type: Date
  - name: card_state
    description: never_funded | funded_never_paid | active | dormant_7_30 |
      dormant_30plus, relative to observed_through.
    data_type: String
    tests:
    - not_null
    - accepted_values:
        values: ['never_funded', 'funded_never_paid', 'active', 'dormant_7_30', 'dormant_30plus']
  - name: days_since_last_payment
    description: Days from last Payment to observed_through; NULL if never paid.
    data_type: Nullable(Int32)
  - name: days_since_wallet_active
    description: Days from last non-fee wallet transfer to observed_through; NULL when
      unmapped.
    data_type: Nullable(Int32)
  - name: wallet_active_7d
    description: Tighter aliveness read. The 2026-08-10 findings were quoted on this
      horizon; engagement_segment uses the 30d one. Never mix the two in one number.
    data_type: UInt8
  - name: wallet_active_30d
    description: The horizon engagement_segment is built on - a month of silence is a
      real signal.
    data_type: UInt8
  - name: wallet_transfers_recent
    description: Non-fee wallet transfers in the 30 days to observed_through.
    data_type: Nullable(UInt64)
  - name: wallet_out_usd_recent
    description: Priced wallet outflow in the 30 days to observed_through, ALL transfer
      sizes. Flow-of-funds; a handful of treasury-scale transfers dominate it. Do not
      size an opportunity on this column.
    data_type: Nullable(Float64)
  - name: wallet_out_usd_recent_retail
    description: Same window, transfers under $1,000 only. The retail-behaviour number
      and the one to use for reactivation sizing.
    data_type: Nullable(Float64)
  - name: wallet_to_card_usd_recent
    description: The share of that outflow which reached the GP card.
    data_type: Nullable(Float64)
  - name: engagement_segment
    description: >-
      The actionable axis. card_active | never_funded | <card_state>__wallet_alive /
      __wallet_gone / __wallet_unmapped. '__wallet_alive' on a dormant card is the
      reactivation target; '__wallet_unmapped' is a coverage limit, not absence.
      never_funded is NOT split on the wallet axis - an unfunded card has no funder, so
      it can never have a funding wallet, and splitting it would invent a coverage gap
      that is true by construction.
    data_type: String
    tests:
    - not_null
  meta:
    owner: analytics_team
    authoritative: false

- name: fct_celo_gpay_wallet_share_of_spend_daily
  description: |
    Daily split of what cardholders send OUT of their own wallet: how much went to the
    GP card, and how much went somewhere else. The competitive question, on-chain.
    Solo funders only (a hub's outflow is GP onboarding, not a user choosing), priced
    stablecoins only (token_class from the whitelist seed, never a symbol list).

    THE OUTLIER SPLIT IS THE WHOLE POINT, DO NOT DROP IT. Over 2026-08-05..08 the raw
    comparison was $365k sent elsewhere against $48.9k to the card, which reads as the
    card capturing 12% of its holders' money. It does not: SIX transfers of $1,000+
    carried $313.7k of that $365k (largest single $154k - treasury-scale movement by a
    handful of addresses, not retail behaviour). Excluding them the two sides are
    ~$51.4k against ~$48.9k, i.e. roughly half. usd_excl_large is the
    retail-behaviour number, usd_total the flow-of-funds number; they answer different
    questions and neither is wrong, but mixing them is.

    Medians over that window were $20.00 to the card against $1.35 elsewhere: the card
    holds the large ticket while the wallet keeps micro-payments - complement rather
    than cannibalisation. That is one window; re-check before repeating it.
  columns:
  - name: date
    description: Activity date.
    data_type: Date
  - name: destination
    description: to_card (counterparty is a Safe in the card registry) or to_elsewhere.
    data_type: String
    tests:
    - not_null
    - accepted_values:
        values: ['to_card', 'to_elsewhere']
  - name: n_transfers
    description: Priced stablecoin outbound transfers, gas receipts excluded.
    data_type: UInt64
  - name: n_wallets
    description: Distinct solo funding wallets sending that day.
    data_type: UInt64
  - name: usd_total
    description: All outbound value including large transfers. Flow-of-funds, NOT
      retail behaviour - read with usd_excl_large.
    data_type: Float64
  - name: usd_excl_large
    description: Outbound value from transfers under $1,000. The retail-behaviour
      number, and the one api_celo_gpay_wallet_share_of_spend_monthly serves as `value`.
    data_type: Float64
  - name: n_transfers_excl_large
    description: Count behind usd_excl_large.
    data_type: UInt64
  - name: n_transfers_large
    description: Count of transfers at or above $1,000 - typically a handful, and they
      carry most of usd_total.
    data_type: UInt64
  - name: usd_median
    description: Median ticket size. The honest central measure here, given the skew.
    data_type: Float64
  meta:
    owner: analytics_team
    authoritative: false

- name: api_celo_gpay_cardholder_engagement
  description: >
    Current card population split by engagement segment: for cards not being used, is
    the holder still active on Celo at all? See fct_celo_gpay_cardholder_engagement for
    horizon clipping and for why '__wallet_unmapped' is a coverage limit rather than an
    observation of absence.
  meta: {owner: analytics_team, authoritative: false}
  columns:
  - name: label
    description: engagement_segment from fct_celo_gpay_cardholder_engagement.
    data_type: String
  - name: value
    description: Cards in this segment.
    data_type: UInt64
  - name: wallet_out_usd_retail
    description: Summed 30-day wallet outflow under $1,000 per transfer - the size of
      the prize for the reactivation segments.
    data_type: Float64
  - name: wallet_out_usd_total
    description: Same window, all transfer sizes. Published alongside the retail figure
      because the two diverge by an order of magnitude.
    data_type: Float64
  - name: as_of_date
    description: The horizon the segmentation is computed as of.
    data_type: Date
- name: api_celo_gpay_wallet_share_of_spend_monthly
  description: >
    Monthly share of cardholder stablecoin outflow reaching the GP card vs going
    elsewhere. `value` is the RETAIL number (transfers under $1,000); value_all is raw
    flow including large treasury-scale movements that a handful of addresses dominate.
    Read fct_celo_gpay_wallet_share_of_spend_daily before quoting either.
  meta: {owner: analytics_team, authoritative: false}
  columns:
  - name: date
    description: Month start.
    data_type: Date
  - name: label
    description: to_card or to_elsewhere.
    data_type: String
  - name: value
    description: Retail outflow (transfers under $1,000) in USD.
    data_type: Float64
  - name: value_all
    description: All outflow in USD, large transfers included.
    data_type: Float64
  - name: transfers
    description: Outbound transfer count.
    data_type: UInt64
  - name: peak_daily_wallets
    description: Highest single-day distinct sending wallets in the month. Not a
      monthly unique count - daily figures cannot be summed or maxed into one.
    data_type: UInt64

- name: fct_celo_gpay_wallet_tenure
  description: |
    One row per GP card funding wallet: how long it had been active on Celo before it
    funded a card. The acquisition-vs-cross-sell question, answered per wallet.

    WHAT IT SETTLES. If wallets predate their card by months, GP on Celo is selling into
    MiniPay's installed base - a distribution result. If they appear days before the card,
    GP is bringing people on-chain - an acquisition result. Both produce the same headline
    card count, and the two were indistinguishable before this model.

    LEFT-CENSORING IS THE CENTRAL CAVEAT, NOT A ROUNDING ERROR. celo_execution starts at
    the L2 migration (2025-03-26) and Celo's L1 history is not in this warehouse, so
    first_seen_at means "first seen BY US". For any wallet already active at the
    migration it is a floor, not a birth date, and those wallets pile up at the window
    edge where they would otherwise manufacture a fake cohort of wallets born the day the
    L2 launched. is_left_censored marks them and days_before_first_funding is a LOWER
    BOUND for them, exact for everyone else. Never average that column without splitting
    on the flag, and never report a median tenure without reporting the censored share
    beside it.
  columns:
  - name: wallet_address
    description: The funding wallet.
    data_type: String
    tests:
    - unique
    - not_null
  - name: card_safe_address
    description: The funded card, for solo funders only; NULL for hubs.
    data_type: Nullable(String)
  - name: is_solo_funder
    description: 1 when this wallet funded exactly one card.
    data_type: UInt8
  - name: n_cards_funded
    description: Distinct cards this wallet funded.
    data_type: UInt64
  - name: first_seen_at
    description: First Transfer leg we ever observed for this wallet. A FLOOR, not a
      birth date, whenever is_left_censored = 1.
    data_type: Nullable(Date)
  - name: last_seen_at
    description: Most recent Transfer leg observed.
    data_type: Nullable(Date)
  - name: first_active_month_nonfee
    description: First month with at least one non-gas leg - the stricter "first did
      something economic" reading.
    data_type: Nullable(Date)
  - name: first_funded_at
    description: Date this wallet first funded a card.
    data_type: Date
  - name: months_present
    description: Distinct months with any observed leg. A coarse engagement depth signal
      that is unaffected by censoring.
    data_type: UInt64
  - name: n_legs_lifetime
    description: All observed Transfer legs, gas receipts included.
    data_type: UInt64
  - name: n_legs_nonfee_lifetime
    description: Observed legs excluding gas receipts.
    data_type: UInt64
  - name: days_before_first_funding
    description: Days from first_seen_at to first_funded_at. Non-negative by construction
      (the funding transfer is itself a leg this wallet sent). EXACT when
      is_left_censored = 0, a LOWER BOUND when it is 1.
    data_type: Nullable(Int32)
  - name: is_left_censored
    description: 1 when the wallet was first observed within 7 days of the start of
      coverage, making it indistinguishable from one active on Celo L1 for years.
    data_type: UInt8
  - name: tenure_bucket
    description: >-
      unknown | pre_dates_our_window | same_day | 1_7_days | 8_30_days | 31_90_days |
      91_180_days | over_180_days. Censoring takes precedence over the day count: a
      censored wallet gets its own label rather than being filed under whatever bucket
      its floor happens to land in, which would understate tenure and bias every cohort
      built on this column.
    data_type: String
    tests:
    - not_null
    - accepted_values:
        values: ['unknown', 'pre_dates_our_window', 'same_day', '1_7_days', '8_30_days', '31_90_days', '91_180_days', 'over_180_days']
  - name: is_pre_existing_user
    description: Blunt headline read - active on Celo well before the card. TRUE for all
      censored wallets by definition, since they predate the observation window.
    data_type: UInt8
  meta:
    owner: analytics_team
    authoritative: false

- name: api_celo_gpay_wallet_tenure
  description: >
    How long GP card funding wallets had been active on Celo before funding a card, by
    tenure bucket. Read 'pre_dates_our_window' as "at least this long, unknown how much
    longer" - those wallets were already transacting when coverage opens at the L2
    migration, so their true tenure is unmeasurable here and certainly longer than any
    number this model could print. See fct_celo_gpay_wallet_tenure.
  meta: {owner: analytics_team, authoritative: false}
  columns:
  - name: label
    description: tenure_bucket from fct_celo_gpay_wallet_tenure.
    data_type: String
  - name: value
    description: Funding wallets in this bucket.
    data_type: UInt64
  - name: median_days_before_funding
    description: Median days on chain before first funding. Exact for uncensored buckets;
      a lower bound inside 'pre_dates_our_window'.
    data_type: Nullable(Float64)
  - name: as_of_date
    description: Latest first-funding date covered, as a single scalar across buckets.
    data_type: Nullable(Date)
