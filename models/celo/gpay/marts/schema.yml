- name: fct_celo_gpay_snapshots
  description: |
    All-time and trailing-7D headline snapshots per action (Volume/Count/Users),
    plus TotalBalance and RewardBalance. Feeds the counter tiles. No Cashback action
    branch (Gnosis Chain only).

    TotalBalance is the latest-day SPENDABLE float: mark-to-market USD across
    token_class = 'STABLECOIN'. RewardBalance is the same for token_class = 'RWA'
    (zero until the cashback program pays out). The split is driven by
    celo_tokens_whitelist.token_class, never a hardcoded symbol list, so a newly
    transacting token cannot be silently excluded from the headline. RWA is reported
    separately rather than blended because a reward token is not spendable at the
    settlement contract.

    FundedCards (added 2026-08-05) counts cards that have ever RECEIVED money and is
    deliberately distinct from PaymentUsers, which counts cards that have ever SPENT.
    The two were conflated: api_celo_gpay_total_funded served PaymentUsers, so the
    funded tile read 662 when 1087 cards had been funded. Funnel: issued (registry, not
    in this model) > FundedCards > PaymentUsers.
  columns:
  - name: label
    description: >-
      Metric label, e.g. PaymentVolume, TopupCount, WithdrawalUsers, TotalBalance,
      RewardBalance, FundedCards.
    data_type: String
  - name: window
    description: "'All' (all-time) or '7D' (trailing 7 days)."
    data_type: String
  - name: value
    description: >-
      Snapshot value. For the balance labels, NULL means a position is held but
      unpriced (a visible failure) whereas 0 means no position — the two are
      deliberately distinguished so an outage cannot render as a plausible $0 tile.
    data_type: Nullable(Float64)
  - name: change_pct
    description: Percent change vs the prior 7-day window (7D rows only; NULL for All).
    data_type: Nullable(Float64)
  meta:
    owner: analytics_team
    authoritative: false

- name: fct_celo_gpay_kpi_monthly
  description: |
    Monthly KPIs - MAU (and per-action MAU), payment/deposit/withdrawal USD
    volumes, net flow (deposits minus withdrawals), ARPU, avg tx/user, repeat
    purchase rate. Deposit == Top-up, Withdrawal == Withdrawal. No cashback
    columns. Partial current month excluded. Whitelisted tokens only (USDT/USDC in practice — see scope note).
  columns:
  - name: month
    description: Calendar month start.
    data_type: Date
  - name: mau
    description: Distinct Safes with any GP activity in the month.
    data_type: UInt64
  - name: payment_mau
    description: Distinct Safes that paid in the month.
    data_type: UInt64
  - name: deposit_mau
    description: Distinct Safes with a Top-up in the month.
    data_type: UInt64
  - name: withdrawal_mau
    description: Distinct Safes with a Withdrawal in the month.
    data_type: UInt64
  - name: total_payment_volume_usd
    description: Card-spend USD volume for the month.
    data_type: Float64
  - name: total_payment_count
    description: Number of payments in the month.
    data_type: UInt64
  - name: total_deposit_volume_usd
    description: Top-up USD volume for the month.
    data_type: Float64
  - name: total_withdrawal_volume_usd
    description: Withdrawal USD volume for the month.
    data_type: Float64
  - name: net_flow_usd
    description: >-
      Deposits minus withdrawals (USD). Excludes card spend. Both components are
      coalesced to 0, so a month in which an action did not occur no longer turns
      this NULL — before that fix May 2026 (no withdrawals) read NULL here.
    data_type: Float64
  - name: reversal_total_usd
    description: >-
      Processor-refund (Reversal) USD volume for the month. Currently 0 in every
      month: GP has never issued a Reversal on Celo, so the action does not appear
      in int_celo_gpay_activity at all. 0 means "none happened", not "not tracked".
    data_type: Float64
  - name: arpu
    description: Average revenue (payment volume) per paying Safe.
    data_type: Float64
  - name: avg_tx_per_user
    description: Average payment count per paying Safe.
    data_type: Float64
  - name: repeat_purchase_rate
    description: Percent of paying Safes with 2+ payments in the month.
    data_type: Float64
  meta:
    owner: analytics_team
    authoritative: false

- name: fct_celo_gpay_retention_monthly
  description: Monthly payment-cohort retention (users + USD). Cohort = month of a Safe's first Payment. Whitelisted tokens only (USDT/USDC in practice — see scope note).
  columns:
