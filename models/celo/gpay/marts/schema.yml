- name: fct_celo_gpay_balances_safe_daily
  description: |
    DENSE per-Safe/token/day net-flow balance (Celo analog of Gnosis Chain's
    int_execution_gpay_balances_user_daily). Densified over a date spine so
    downstream daily totals and latest-day snapshots are correct on every day.
    Net flow = (Top-up + Reversal) - (Payment + Withdrawal). Equals the true
    on-chain balance only for whitelisted tokens under the documented scope
    assumptions (see file header). Not a chain-wide balance snapshot.
  columns:
  - name: date
    description: Calendar date (dense).
    data_type: Date
  - name: safe_address
    description: GP card Safe address.
    data_type: String
  - name: token_symbol
    description: USDC or USDT.
    data_type: String
  - name: token_class
    description: >-
      STABLECOIN or RWA, from celo_tokens_whitelist ('UNKNOWN' if a symbol is somehow
      absent from the seed). Exists so headline figures can separate spendable float
      from reward holdings without hardcoding a symbol list — fct_celo_gpay_snapshots
      reports STABLECOIN as TotalBalance and RWA as RewardBalance.
    data_type: String
  - name: balance
    description: >-
      Cumulative net NATIVE-token balance as of this date. This is the quantity of
      tokens held; 25,676.93 across all cards on 2026-08-04.
    data_type: Float64
  - name: balance_usd
    description: >-
      MARK-TO-MARKET USD value: `balance` valued at the token's price as of this date,
      carried forward from the last observed price via ASOF join. It is NOT a running
      sum of each flow's USD value — that would be an accumulated cost basis, a
      different quantity that goes arbitrarily wrong for a volatile token (and can go
      negative while the card still holds it). Flows are valued at transaction time
      (int_celo_gpay_activity.amount_usd, correctly historical); stocks are valued as
      of the reporting date, which is this column.
      NULL, never 0, when a held token has no price at or before this date — unknown
      must not read as empty. sum() therefore skips such positions, which is what the
      two valuation tests on this model guard against.
      Additive across cards and tokens within a date; NEVER across dates.
    data_type: Nullable(Float64)
  - name: price_date
    description: >-
      The date of the price actually used to value this row. Equals `date` when an
      oracle answer landed that day, and is EARLIER when the ASOF join carried the
      last observed price forward (the price hub does not forward-fill). Exposed so
      the valuation is auditable and so staleness is assertable — the carry-forward is
      uncapped by design. NULL means no price existed at or before `date`, in which
      case balance_usd is NULL too.
    data_type: Nullable(Date)
  tests:
  # The uncapped ASOF carry-forward is only safe if these two fire. Both are scoped to
  # rows that actually hold something: a stale price on a zero balance is harmless, and
  # most of this dense table is zero-balance rows.
  #   1. held but UNPRICED -> balance_usd NULL -> sum() skips it, so the position
  #      disappears from TotalBalance rather than reading zero.
  - dbt_utils.expression_is_true:
      name: celo_gpay_held_token_is_priced
      expression: "balance_usd IS NOT NULL"
      config:
        severity: warn
        where: "abs(balance) > 0.000001"
  #   2. held but STALE -> the float is valued at an old rate. Pennies for a
  #      stablecoin, unbounded for the whitelisted RWA token XAUt0. The 2-day
  #      tolerance matches dq_daily_unpriced_tokens and absorbs the feed's 1-day lag.
  - dbt_utils.expression_is_true:
      name: celo_gpay_held_token_price_is_fresh
      expression: "dateDiff('day', price_date, date) <= 2"
      config:
        severity: warn
        where: "abs(balance) > 0.000001 AND date >= today() - 3"
  meta:
    owner: analytics_team
    authoritative: false

- name: fct_celo_gpay_balances_by_token_daily
  description: Total net-flow balance across all Safes, per day per token. Built from the dense per-Safe base. Whitelisted tokens only (USDT/USDC in practice — see scope note).
  columns:
  - name: date
    description: Calendar date.
    data_type: Date
  - name: symbol
    description: >-
      Whitelisted token symbol. No filter is applied here; USDT and USDC are simply
      the only tokens that have ever carried a balance (all 69 spine days).
    data_type: String
  - name: token_class
    description: >-
      STABLECOIN or RWA, inherited from the per-Safe base. Partition headline totals
      on this rather than on a symbol list.
    data_type: String
  - name: balance
    description: Total net native-token balance across all Safes.
    data_type: Float64
  - name: balance_usd
    description: >-
      Total MARK-TO-MARKET USD value across all Safes (native balance valued at that
      date's price), inherited from the per-Safe base — not a cost basis. Positions
      whose token has no price at or before the date are NULL upstream and are skipped
      by this sum; dq_daily_celo_gpay_stale_held_token_price is the guard.
    data_type: Nullable(Float64)
  meta:
    owner: analytics_team
    authoritative: false

- name: fct_celo_gpay_balance_cohorts_daily
  description: Per-day holder distribution across balance buckets, by token, in USD and native units. Zero/negative balances excluded. Whitelisted tokens only (USDT/USDC in practice — see scope note).
  columns:
  - name: date
    description: Calendar date.
    data_type: Date
  - name: symbol
    description: USDC or USDT.
    data_type: String
  - name: cohort_unit
    description: "'usd' or 'native' - which unit the bucket boundaries apply to."
    data_type: String
  - name: balance_bucket
    description: "Bucket label, e.g. 0-10, 10-100, 100-1K, ..."
    data_type: String
  - name: holders
    description: Number of Safes in the bucket on this date.
    data_type: UInt64
  - name: value_native
    description: Summed native balance of Safes in the bucket.
    data_type: Float64
  - name: value_usd
    description: Summed USD balance of Safes in the bucket.
    data_type: Float64
  meta:
    owner: analytics_team
    authoritative: false

# ── API views ─────────────────────────────────────────────────────────────
# Thin, dashboard-facing views. Column contracts (date/label/value etc.) mirror
# the Gnosis Chain api_execution_gpay_* views so the frontend query files are
# near-identical. Same whitelisted-token scope as the facts above.

- name: fct_celo_gpay_card_funnel
  description: |
    One row per card - issuance, first funding, first spend, and the lags between.
    The atom behind fct_celo_gpay_funnel_cohorts_monthly.

    Every column is measured as of ONE horizon, `observed_through`, taken from
    int_celo_gpay_activity_daily. The three signals come from models built at
    different times (int_celo_gpay_wallets rebuilds fully each run and reaches head;
    int_celo_gpay_activity_daily is incremental and lags), so without a shared
    horizon a card issued yesterday reads as issued-but-never-funded purely because
    funding has not been built yet. Cards issued after the horizon are excluded, and
    first_spend_at is clipped to it even where wallets already knows it.

    NEVER divide is_funded by row count to get a conversion rate. Issuance is still
    ramping, so most cards are young and "unfunded" mostly means "issued recently".
    Use observation_days to restrict to cards old enough to have had a fair chance,
    or read fct_celo_gpay_funnel_cohorts_monthly which does it for you.

    first_fund_channel is the funding_channel of the card's FIRST inbound transfer
    (from int_celo_gpay_funding_tx_envelopes). It is a shape classification, not an
    identity label — CIP-64 alone is not MiniPay. NULL when the card has never been
    funded. Channel values (same glossary as fct_celo_gpay_card_funding):

      cip64_direct_solo — CIP-64 (tx type 123) + funder EOA called token.transfer()
        + that funder funds exactly one card. MiniPay-shaped; do not rename to
        "minipay" without an off-chain identity source.
      other_direct — same direct EOA transfer() shape, but envelope is not CIP-64
        (type 0/2), and the funder funds exactly one card.
      hub — this first-fund's funder funds two or more cards (fan-out wins over
        envelope; includes the legacy 0xa0dd… onboarding hub).
      mediated — first fund was not a direct EOA→token transfer (e.g. Safe
        execTransaction).
      mixed — reserved for relationship-level disagreement on
        fct_celo_gpay_card_funding; first_fund_channel reads per-transfer envelopes
        so it does not emit mixed today, but the value stays accepted.
      unknown — funding transfer row exists but no matching transactions row.
  columns:
  - name: safe_address
    description: GP card Safe address. One row per card.
    data_type: String
    tests:
    - unique
    - not_null
  - name: issued_at
    description: Date the Safe was provisioned as a card (SafeSetup), from int_celo_gpay_wallets.
    data_type: Date
    tests:
    - not_null
  - name: first_funded_at
    description: >-
      Date the card first RECEIVED money - the first inbound action (Top-up, Reversal
      or Cashback) in int_celo_gpay_activity_daily. NULL if it never has, which is
      distinct from a zero lag.
    data_type: Nullable(Date)
  - name: first_spend_at
    description: >-
      Date the card first SPENT - a stablecoin settlement to a bridge, from
      int_celo_gpay_wallets.first_spend_at, clipped to observed_through so it cannot
      run ahead of the funding signal.
    data_type: Nullable(Date)
  - name: first_fund_channel
    description: >-
      funding_channel of the card's first inbound transfer. Shape classification,
      not MiniPay identity. NULL if never funded. See model description for values.
    data_type: Nullable(String)
    tests:
    - accepted_values:
        values: ['cip64_direct_solo', 'other_direct', 'hub', 'mediated', 'mixed', 'unknown']
        config:
          where: "first_fund_channel IS NOT NULL"
  - name: is_funded
    description: Card has ever received money as of observed_through.
    data_type: Bool
  - name: is_activated
    description: >-
      Card has ever spent as of observed_through. Matches
      int_celo_gpay_wallets.is_activated except where a spend falls after the horizon.
    data_type: Bool
  - name: days_issue_to_fund
    description: Days from issuance to first funding. NULL where the card has never been funded.
    data_type: Nullable(Int32)
  - name: days_issue_to_spend
    description: Days from issuance to first spend. NULL where the card has never spent.
    data_type: Nullable(Int32)
  - name: days_fund_to_spend
    description: >-
      Days from first funding to first spend, for cards that did both. Legitimately 0
      - funding and spending the same day is the common MiniPay pattern (152 cards).
    data_type: Nullable(Int32)
  - name: observation_days
    description: >-
      Days from issuance to observed_through - how long this card has been observable.
      The eligibility gate for every conversion rate built on this table.
    data_type: Int32
  - name: observed_through
    description: >-
      The as-of date for the whole row, from max(date) in int_celo_gpay_activity_daily.
      Identical on every row; carried per-row so a consumer reading a slice can still
      see the horizon.
    data_type: Date
  tests:
  # Guaranteed by the horizon filter. If this fires the filter has been removed or the
  # upstream watermark went backwards.
  - dbt_utils.expression_is_true:
      name: celo_gpay_funnel_observation_non_negative
      expression: "observation_days >= 0"
  # Not a hard law, hence warn. A Safe address is deterministic before deployment, so a
  # counterfactual transfer CAN land before SafeSetup. Zero occurrences to date; if it
  # starts firing the windowed rates still behave (a negative lag is inside every
  # window), but the median lags will read low.
  - dbt_utils.expression_is_true:
      name: celo_gpay_funnel_funding_not_before_issuance
      expression: "days_issue_to_fund >= 0"
      config:
        severity: warn
        where: "days_issue_to_fund IS NOT NULL"
  # Spending implies funding. Zero occurrences. Warn rather than error because it
  # indicts the inflow classifier upstream, not this model - a card that spends with no
  # recorded inbound action means int_celo_gpay_activity missed a funding transfer.
  - dbt_utils.expression_is_true:
      name: celo_gpay_funnel_activated_implies_funded
      expression: "is_funded"
      config:
        severity: warn
        where: "is_activated"
  meta:
    owner: analytics_team
    authoritative: false

- name: fct_celo_gpay_funnel_cohorts_monthly
  description: |
    Cards grouped by the month they were ISSUED, with how far each cohort got through
    issued > funded > activated. Rollup of fct_celo_gpay_card_funnel.

    Cohorted and age-normalised on purpose. A single all-time "60% of cards get
    funded" is not a conversion rate on a product that is still ramping - the
    denominator is dominated by cards issued weeks ago, and the headline moves when
    issuance accelerates even if behaviour is identical. Cohorting removes the mix
    shift, the _7d/_30d windows remove the age spread within a cohort.

    Compare the windowed rates, not the _ever columns. funded_ever and activated_ever
    are honest counts as of the horizon but are NOT comparable across rows, because
    older cohorts have had longer to convert - they will always slope down toward the
    present and that slope is an artefact.

    The lag medians are completer-biased and no eligibility gate fixes it. They are
    taken over cards that DID convert, so a young cohort's median only sees its fast
    converters. Expect medians to drift up as a cohort matures; compare them only
    where cohort_complete_30d is true.
  columns:
  - name: cohort_month
    description: Month the cards were issued. NOT a month of activity.
    data_type: Date
    tests:
    - unique
    - not_null
  - name: cards_issued
    description: Cards issued in the month, as of observed_through.
    data_type: UInt64
  - name: eligible_7d
    description: >-
      Cards with at least 7 days of observation - the denominator for the 7-day rates.
      Smaller than cards_issued for the current cohort, and 0 for a cohort younger
      than a week.
    data_type: UInt64
  - name: eligible_30d
    description: Cards with at least 30 days of observation - the denominator for the 30-day rates.
    data_type: UInt64
  - name: funded_7d
    description: Eligible cards funded within 7 days of issuance.
    data_type: UInt64
  - name: funded_30d
    description: Eligible cards funded within 30 days of issuance.
    data_type: UInt64
  - name: funded_ever
    description: Cards funded at any point up to observed_through. Not comparable across cohorts.
    data_type: UInt64
  - name: activated_7d
    description: Eligible cards that spent within 7 days of issuance.
    data_type: UInt64
  - name: activated_30d
    description: Eligible cards that spent within 30 days of issuance.
    data_type: UInt64
  - name: activated_ever
    description: Cards that spent at any point up to observed_through. Not comparable across cohorts.
    data_type: UInt64
  - name: funded_rate_7d
    description: >-
      funded_7d / eligible_7d. NULL where no card in the cohort has 7 days of
      observation yet - undefined rather than zero, so dashboards do not draw a cliff
      at the current month that reads as a collapse in conversion.
    data_type: Nullable(Float64)
  - name: funded_rate_30d
    description: funded_30d / eligible_30d. NULL where the cohort has no 30-day-old cards.
    data_type: Nullable(Float64)
  - name: activated_rate_7d
    description: activated_7d / eligible_7d - issuance to first spend, both legs.
    data_type: Nullable(Float64)
  - name: activated_rate_30d
    description: activated_30d / eligible_30d - issuance to first spend, both legs.
    data_type: Nullable(Float64)
  - name: spend_rate_of_funded_7d
    description: activated_7d / funded_7d - the second leg alone, which is where the drop-off is.
    data_type: Nullable(Float64)
  - name: spend_rate_of_funded_30d
    description: activated_30d / funded_30d - the second leg alone, over 30 days.
    data_type: Nullable(Float64)
  - name: cohort_complete_7d
    description: >-
      Every card in the row has cleared 7 days of observation. FALSE means the 7-day
      rate is computed on a subset and will still move.
    data_type: Bool
  - name: cohort_complete_30d
    description: Every card in the row has cleared 30 days of observation.
    data_type: Bool
  - name: median_days_issue_to_fund
    description: Median lag among cards that were funded. Completer-biased in young cohorts.
    data_type: Int32
  - name: p90_days_issue_to_fund
    description: 90th percentile lag among cards that were funded.
    data_type: Int32
  - name: median_days_fund_to_spend
    description: Median lag from funding to first spend, among cards that did both.
    data_type: Int32
  - name: p90_days_fund_to_spend
    description: 90th percentile lag from funding to first spend.
    data_type: Int32
  - name: observed_through
    description: As-of date inherited from fct_celo_gpay_card_funnel.
    data_type: Date
  tests:
  # Both guaranteed by the countIf construction - a numerator cannot exceed its own
  # eligibility gate. These exist to catch a future edit that changes one condition
  # and not the other, which is the easy way to break a windowed rate.
  - dbt_utils.expression_is_true:
      name: celo_gpay_funnel_cohort_funded_within_eligible
      expression: "funded_7d <= eligible_7d AND funded_30d <= eligible_30d"
  - dbt_utils.expression_is_true:
      name: celo_gpay_funnel_cohort_activated_within_funded
      expression: "activated_7d <= funded_7d AND activated_30d <= funded_30d"
      config:
        severity: warn
  - dbt_utils.expression_is_true:
      name: celo_gpay_funnel_cohort_rates_are_proportions
      expression: "funded_rate_7d BETWEEN 0 AND 1 AND funded_rate_30d BETWEEN 0 AND 1"
      config:
        where: "funded_rate_7d IS NOT NULL AND funded_rate_30d IS NOT NULL"
  meta:
    owner: analytics_team
    authoritative: false

- name: fct_celo_gpay_settlement_batches
  description: |
    One row per settlement transaction - how many card charges it swept, how much left
    the contract, where it went, and what the bridge hop cost in CELO. Built on the
    decoded event layer contracts_celo_gpay_settlement_events.

    There is no settlement lag and no float, which is why this model exists instead of
    the lag and float marts originally scoped. The sweep is atomic - all 476 settlement
    transactions contain both the charges and the outflow, and not one does only one or
    the other. Charge-to-settlement time is therefore zero by construction and value in
    flight never exists. The only residual is cross-token - about 10 percent of
    (transaction, token) charge groups pull a token that transaction does not settle,
    so it waits for the next sweep of that token.

    Charge amounts are token-agnostic on purpose. The legacy contract reports the WRONG
    token on TokenPullSuccess - it labels all 1,752 of its pulls USDC while the chain
    shows 345 USDC and 1,407 USDT arriving. Counts and amounts are correct, only the
    token field lies. Both stablecoins are 6-decimal so the summed amount stays exact,
    but a per-token split of charges would not be and is not offered. Settlement
    outflows DO carry the right token on both contracts, verified against raw ERC-20
    Transfer logs, which is why charges and settlements are sourced differently here.
  columns:
  - name: batch_time
    description: Timestamp of the settlement transaction.
    data_type: DateTime
  - name: batch_date
    description: Calendar date of the settlement transaction.
    data_type: Date
  - name: transaction_hash
    description: The settlement transaction. One row per hash.
    data_type: String
    tests:
    - unique
    - not_null
  - name: settlement_contract
    description: Address of the settlement contract, unprefixed lowercase as stored in the decode layer.
    data_type: String
  - name: settlement_label
    description: >-
      settlement_legacy or settlement_current, from the celo_gpay_settlement_contracts
      seed. 'unknown' would mean a contract is emitting settlement events without being
      in the seed, which should never happen.
    data_type: String
  - name: n_charges
    description: Successful card charges (TokenPullSuccess) swept in this transaction.
    data_type: UInt64
  - name: n_failed_charges
    description: >-
      Failed pulls (TokenPullFailedWithAmount) in this transaction. 7 in total ever,
      all between 2026-05-28 and 2026-06-29, none since.
    data_type: UInt64
  - name: charged_amount
    description: >-
      Total pulled from cards, in stablecoin units. Token-agnostic - see the model
      description. Exact because both settlement stablecoins carry 6 decimals.
    data_type: Float64
  - name: failed_amount
    description: Amount GP attempted to pull and could not (originAmount on the failure event).
    data_type: Float64
  - name: n_bridged
    description: SettlementBridged events - value sent to another chain via LayerZero.
    data_type: UInt64
  - name: n_transferred
    description: SettlementTransferred events - value sent to a receiver on Celo.
    data_type: UInt64
  - name: bridged_amount
    description: Stablecoin units bridged off Celo in this transaction.
    data_type: Float64
  - name: transferred_amount
    description: Stablecoin units transferred to a Celo receiver in this transaction.
    data_type: Float64
  - name: settled_amount
    description: Total stablecoin units that left the contract. Equals charged_amount per contract over all time.
    data_type: Float64
  - name: settled_usd
    description: settled_amount priced per token at the batch date.
    data_type: Float64
  - name: receivers
    description: >-
      Distinct settlement receivers in this transaction. An array because one
      transaction can bridge one token and locally transfer another to different
      destinations. The local receiver changed from 0x8ab54f9e to 0xdc9b73c3 after
      2026-06-10.
    data_type: Array(String)
  - name: destination_eids
    description: >-
      LayerZero destination endpoint IDs for bridged value. 30101 (Ethereum) is the only
      value observed. Empty for transaction that only settle locally.
    data_type: Array(String)
  - name: native_fee_celo
    description: >-
      CELO paid for the LayerZero hop. Zero for locally-settled batches, which cost
      nothing beyond gas.
    data_type: Float64
  - name: native_fee_usd
    description: native_fee_celo priced at the batch date.
    data_type: Float64
  - name: fee_usd_per_charge
    description: >-
      Bridge cost attributed per card charge in the batch. NULL rather than 0 when a
      batch has no charges, so empty batches drop out of averages instead of dragging
      them toward zero.
    data_type: Nullable(Float64)
  tests:
  # Value conservation. The contract is a pass-through - everything pulled from cards
  # leaves again - so this holds to the cent over all time on both contracts. It is
  # asserted per row only in the weak direction, because a single transaction can settle
  # a token pulled by an earlier one.
  - dbt_utils.expression_is_true:
      name: celo_gpay_settlement_amounts_non_negative
      expression: "charged_amount >= 0 AND settled_amount >= 0 AND native_fee_celo >= 0"
  # Every settlement contract must be in the seed, or discovery has missed a deployment
  # the way it missed the second bridge before 2026-08-05.
  - dbt_utils.expression_is_true:
      name: celo_gpay_settlement_contract_is_seeded
      expression: "settlement_label != 'unknown'"
  # A bridged batch always pays a LayerZero fee; a purely local one never does. If this
  # fires, either the fee event stopped firing or a new settlement path exists.
  - dbt_utils.expression_is_true:
      name: celo_gpay_settlement_bridged_batches_pay_a_fee
      expression: "native_fee_celo > 0"
      config:
        where: "n_bridged > 0"
  - dbt_utils.expression_is_true:
      name: celo_gpay_settlement_local_batches_pay_no_bridge_fee
      expression: "native_fee_celo = 0"
      config:
        where: "n_bridged = 0"
  meta:
    owner: analytics_team
    authoritative: false

