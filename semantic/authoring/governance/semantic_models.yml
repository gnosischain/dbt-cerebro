semantic_models:
- name: governance_proposals_latest
  model: ref('api_governance_proposals_latest')
  defaults:
    agg_time_dimension: created_at
  entities:
  - name: proposal
    type: primary
    expr: id
  dimensions:
  - name: created_at
    type: time
    expr: created_at
    type_params:
      time_granularity: day
  - name: gip_number
    type: categorical
    expr: gip_number
  - name: is_gip
    type: categorical
    expr: is_gip
  - name: outcome
    type: categorical
    expr: outcome
  - name: category
    type: categorical
    expr: category
  measures:
  - name: governance_proposals_latest__unique_voters_value
    agg: sum
    expr: unique_voters
  - name: governance_proposals_latest__total_vp_value
    agg: sum
    expr: total_vp
  - name: governance_proposals_latest__proposal_count
    agg: count
    expr: id
  config:
    meta:
      cerebro:
        owner: analytics_team
        quality_tier: approved
        grain: day
        question_synonyms:
        - governance proposals
        - gnosisdao proposals
        - gip proposals list

- name: governance_kpis_latest
  model: ref('api_governance_kpis_latest')
