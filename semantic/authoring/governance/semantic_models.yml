# --- Intermediates -----------------------------------------------------------
# Registered at `candidate` tier for coverage and docs, not for public metric
# routing: the api_ endpoints above are the supported read path. Dimensions and
# measures reference only columns DECLARED in models/governance/**/schema.yml,
# since the registry validator resolves exprs against declared columns.
# Two names keep their int_ prefix because the stripped name is already taken by
# the api_ endpoint block above.

