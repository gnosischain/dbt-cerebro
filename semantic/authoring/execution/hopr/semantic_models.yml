# HOPR mixnet / GnosisVPN semantic models.
#
# Hand-corrected after scaffolding. The generated defaults turned every numeric
# column into a sum(), which produced three actively misleading measures:
#   - sum(is_cover_traffic): a 0/1 flag summed into a meaningless number. It is a
#     DIMENSION, and the cover-traffic split is the entire point of the fact table
#     (~100% of dufour ticket value is HOPR's own cover traffic, i.e. a staking
#     rewards programme rather than user demand). It is now a dimension.
#   - sum(ticket_index): ticket_index advances by a ticket's index RANGE, not one
#     per ticket, so it is not a count and must never be aggregated as a volume.
#     Removed.
#   - sum(balance_wei) / sum(packing_overflow_check): balance is per-event state,
#     not a flow, and packing_overflow_check is an internal integrity guard.
#     Neither is a metric. Removed.
# Distinct counts are exposed with agg: max, never sum -- summing a per-day
# uniqExact across days double-counts.

semantic_models:
- name: hopr_nodes
  description: >
    HOPR node dimension. The operator angle is what this exists for:
    distinct_operators over safe_address is the decentralisation metric, because a
    node count says nothing about who controls them (on jura, 15+ of the first 16
    nodes sit under one HOPR-operated Safe). hosting_provider carries the
    home-ISP-vs-hyperscaler signal. geo_source must be respected when reading
    ip_country: only ~15% of announced IPs resolve, so an absent country means
    unenriched, not unknown-location.
  model: ref('int_hopr_nodes')
  config:
    meta:
      cerebro:
        owner: analytics_team
        quality_tier: candidate
        question_synonyms:
        - hopr nodes
        - hopr node operators
        - hopr node geography
        - hopr node hosting providers
        grain: node
  defaults:
    agg_time_dimension: first_announced_at
  dimensions:
  - name: first_announced_at
    description: When the node first announced itself - use for node cohorts.
    type: time
    expr: first_announced_at
    type_params:
      time_granularity: day
  - name: network
    type: categorical
    expr: network
  - name: node_class
    description: cover_traffic, gnosisvpn_exit, or unclassified. Sourced from HOPR's repos.
    type: categorical
    expr: node_class
  - name: safe_address
    description: The operator. Group by this for nodes-per-operator concentration.
    type: categorical
    expr: safe_address
  - name: hosting_provider
    description: Bucketed provider - the home-vs-hyperscaler decentralisation signal.
    type: categorical
    expr: hosting_provider
  - name: ip_country
    description: Country from the announced IP. Only meaningful where geo_source = 'ipinfo'.
    type: categorical
    expr: ip_country
  - name: declared_country
    description: Country the product advertises. NOT verified geography.
    type: categorical
    expr: declared_country
  - name: geo_source
    description: >
      Enrichment provenance ('ipinfo' / 'unenriched' / 'no_ipv4'). Always filter or
      split on this before quoting a geographic distribution.
    type: categorical
    expr: geo_source
  measures:
  - name: hopr_nodes
    description: Node count.
    agg: count
    expr: 1
  - name: hopr_distinct_operators
    description: >
      Distinct Safes controlling these nodes. The decentralisation numerator -
      compare against hopr_nodes for concentration.
    agg: count_distinct
    expr: safe_address
  - name: hopr_node_earned_wxhopr
    description: wxHOPR paid to these nodes as relay destinations. Additive across nodes.
    agg: sum
    expr: earned_wxhopr
  - name: hopr_node_tickets_earned
    description: Ticket redemptions on channels terminating at these nodes.
    agg: sum
    expr: tickets_earned

- name: gnosisvpn_exit_activity_daily
  description: >
    GnosisVPN traffic by exit node and country, per day. Tickets are probabilistic
    payments, so they are proportional to relayed volume in expectation but are NOT
    a bandwidth measurement. Channel counts track how many clients are running, not
    how much they used. City/country are the product's own labels, not verified
    geography.
  model: ref('api_gnosisvpn_exit_activity_daily')
  config:
    meta:
      cerebro:
        owner: analytics_team
        quality_tier: candidate
        question_synonyms:
        - gnosisvpn exit activity
        - gnosis vpn traffic by country
        - vpn exit node usage
        grain: day
  defaults:
    agg_time_dimension: activity_date
  dimensions:
  - name: activity_date
    type: time
    expr: activity_date
    type_params:
      time_granularity: day
  - name: country_code
    type: categorical
    expr: country_code
  - name: location_city
    type: categorical
    expr: location_city
  - name: exit_label
    type: categorical
    expr: exit_label
  measures:
  - name: gnosisvpn_tickets_redeemed
    description: Redeemed tickets on channels terminating at this exit node.
    agg: sum
    expr: tickets_redeemed
  - name: gnosisvpn_redeemed_wxhopr
    description: wxHOPR paid out to this exit, reconstructed from channel balance diffs.
    agg: sum
    expr: redeemed_wxhopr
  - name: gnosisvpn_channels_opened
    description: Channels opened toward this exit. A running-client proxy, not usage.
    agg: sum
    expr: channels_opened
  - name: gnosisvpn_peak_counterparty_nodes
    description: >
      Peak distinct counterparty nodes funding channels to this exit. agg is max,
      not sum: the underlying value is a per-day distinct count and summing it
      across days would double-count. An upper bound on running clients, not users.
    agg: max
    expr: unique_counterparty_nodes

- name: hopr_channels_events
  description: >
    Event-grain HOPR payment-channel activity across both live networks (dufour and
    jura). Neither network emits an amount, so redeemed value is reconstructed from
    per-channel balance diffs.
  model: ref('int_hopr_channels_events')
  config:
    meta:
      cerebro:
        owner: analytics_team
        quality_tier: candidate
        question_synonyms:
        - hopr channel events
        - hopr ticket redemptions
  defaults:
    agg_time_dimension: block_timestamp
  dimensions:
  - name: block_timestamp
    type: time
    expr: block_timestamp
    type_params:
      time_granularity: day
  - name: network
    type: categorical
    expr: network
  - name: event_name
    type: categorical
    expr: event_name
  - name: channel_status
    type: categorical
    expr: channel_status
  measures:
  - name: hopr_channel_events
    description: Count of channel lifecycle events.
    agg: count
    expr: 1
  - name: hopr_redeemed_wei
    description: >
      Value paid out to destination nodes on ticket redemption, in wei. Prefer the
      wxHOPR measures on hopr_network_daily for reporting.
    agg: sum
    expr: redeemed_wei
  - name: hopr_distinct_channels
    description: Distinct channels touched. Non-additive; do not sum across grains.
    agg: count_distinct
    expr: channel_id

- name: hopr_network_daily
  description: >
    Daily HOPR channel activity per network, split by whether the traffic is HOPR's
    own cover traffic. The split is essential: on dufour ~100% of ticket value in
    every year since 2023 is cover traffic, which pays node runners in proportion to
    stake. Reporting the two together presents a rewards schedule as user demand.
  model: ref('fct_hopr_network_daily')
  config:
    meta:
      cerebro:
        owner: analytics_team
        quality_tier: candidate
        question_synonyms:
        - hopr network activity
        - hopr cover traffic share
        - hopr tickets redeemed daily
        grain: day
  defaults:
    agg_time_dimension: activity_date
  dimensions:
  - name: activity_date
    type: time
    expr: activity_date
    type_params:
      time_granularity: day
  - name: network
    type: categorical
    expr: network
  - name: is_cover_traffic
    description: >
      1 where the channel source is a known HOPR cover-traffic node. A DIMENSION,
      never a measure - always split or filter on it before quoting a HOPR usage
      number.
    type: categorical
    expr: is_cover_traffic
  measures:
  - name: hopr_tickets_redeemed
    description: Ticket redemptions. The trustworthy volume metric; time-stable.
    agg: sum
    expr: tickets_redeemed
  - name: hopr_redeemed_wxhopr
    description: wxHOPR paid out to relayers, reconstructed from channel balance diffs.
    agg: sum
    expr: redeemed_wxhopr
  - name: hopr_funded_wxhopr
    description: wxHOPR pushed into channels.
    agg: sum
    expr: funded_wxhopr
  - name: hopr_channels_opened
    description: >
      Channels opened. The cover-traffic share of dufour opens has risen sharply
      since launch, so this measure's composition is not comparable across years --
      prefer tickets for trend claims.
    agg: sum
    expr: channels_opened
  - name: hopr_channels_closed
    description: Channels closed.
    agg: sum
    expr: channels_closed
  - name: hopr_peak_active_channels
    description: >
      Peak channels seen in a day. agg is max, not sum: the underlying value is a
      per-day distinct count.
    agg: max
    expr: active_channels

- name: hopr_network_health_daily
  description: >
    Daily HOPR network health: nodes ever registered on-chain versus nodes actually up.
    The two are not interchangeable and have diverged every year -- registrations
    accumulate and never expire while the live network has shrunk, so the registry now
    overstates the live network several-fold. Any answer about "how big is HOPR" must
    say which of the two it is quoting. Liveness is dufour-only; the prober was never
    ported to jura.
  model: ref('fct_hopr_network_health_daily')
  config:
    meta:
      cerebro:
        owner: analytics_team
        quality_tier: candidate
        question_synonyms:
        - hopr nodes online
        - hopr network size
        - how many hopr nodes are there
        - hopr node availability
        - hopr node latency
        grain: day
  defaults:
    agg_time_dimension: date
  dimensions:
  - name: date
    type: time
    expr: date
    type_params:
      time_granularity: day
  - name: network
    type: categorical
    expr: network
  measures:
  - name: hopr_nodes_online
    description: >
      Mean nodes actually online in a day, from the dashboard's hourly history. THE
      live network size. agg is avg, not sum: the underlying value is already a daily
      average of an hourly level. Read with hopr_hours_observed -- the history is
      missing a substantial share of its hours and a thin day is not comparable to a
      full one.
    agg: avg
    expr: nodes_online_avg
  - name: hopr_hours_observed
    description: >
      Hours the dashboard actually recorded that day, 0 to 24. Not a business metric --
      it is the completeness qualifier for hopr_nodes_online.
    agg: sum
    expr: hours_observed
  - name: hopr_nodes_registered_cumulative
    description: >
      Nodes that ever registered on-chain, cumulative and never decrementing. NOT the
      live network size and consistently several times larger. agg is max, not sum:
      the underlying value is already a running total, so summing it across days
      multiplies it by the number of days.
    agg: max
    expr: nodes_registered_cumulative
  - name: hopr_nodes_registered_new
    description: Nodes registering for the first time on that day. Safe to sum.
    agg: sum
    expr: nodes_registered_new
  - name: hopr_nodes_reachable
    description: >
      Nodes the prober reached that day. agg is max: a per-day count, not an additive
      quantity. dufour only.
    agg: max
    expr: nodes_reachable
  - name: hopr_nodes_high_availability
    description: >
      Nodes up at least 90% of the last 24 hours. agg is max for the same reason.
      dufour only.
    agg: max
    expr: nodes_high_availability
  - name: hopr_median_latency_ms
    description: >
      Median round-trip time across reachable nodes. Prefer this over the mean, which a
      long tail of slow nodes pulls well above the typical node. dufour only.
    agg: avg
    expr: p50_latency_ms
  - name: hopr_avg_availability_24h
    description: Mean 24-hour availability across probed nodes, in [0,1]. dufour only.
    agg: avg
    expr: avg_availability_24h

metrics: []
